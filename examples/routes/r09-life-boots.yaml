# Given route for benchmark route R09: Pristine + Shuddering Life boots.
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# It does not search for anything: in every state the FIRST rule whose conditions match is the one
# that is followed. A goal state is never acted on. A state no rule matches is reported as a gap.
# Lines starting with # are comments and are ignored. The conditions and actions are explained in
# examples/routes/r12-lightning-amulet.yaml.
#
# The route (PoE Vault, "Basic boots crafting", docs/research/2026-10-30-5-reference-routes.md, id R09):
#   1. Use 2-socket resonators (Potent Chaotic Resonators) with a Pristine Fossil and a Shuddering Fossil until
#      the boots hold high Life and a Movement Speed ("When reforging, focus on a higher Life tier as well as a
#      movement speed modifier alongside modifiers you'll be satisfied with").
#
# The guide's finished item is the target's (OR-58, #1289): the top tier of Life and the rolled 35% Movement
# Speed, so the one rule below is followed until the boots hold both. The guide's fallback (a bench-crafted
# Movement Speed where none rolled) is not the target, so no rule crafts it: boots with a lower rolled speed or
# none are rolled again. The guide's optional finish ("You can either keep these or bench-craft the item to
# finish") names no mod and is no rule here (listed for the owner in #1289's pull request).
#
# The guide starts from a rare pair of boots, as the target does (see `start_item` in the target).

name: R09, PoE Vault guide

rules:
  # The bought start is a Normal base (its price is a Normal base's trade search, so the plan starts from it: OR-43, #1522), and a
  # resonator works on a rare item only: the Orb of Alchemy that makes it rare is the player's step before the fossils (OR-16).
  - when:
      rarity: normal
    do: Orb of Alchemy
  # Step 1: use the two fossils (this is also the first use), until the target.
  - when:
      rarity: rare
    do: Fossils Pristine Fossil + Shuddering Fossil
