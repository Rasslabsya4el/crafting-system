# Given route for benchmark route R09: Pristine + Shuddering Life boots.
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# It does not search for anything: in every state the FIRST rule whose conditions match is the one
# that is followed. A goal state is never acted on. A state no rule matches is reported as a gap.
# Lines starting with # are comments and are ignored. The conditions and actions are explained in
# examples/routes/r12-lightning-amulet.yaml.
#
# The route (PoE Vault, "Basic boots crafting", docs/research/2026-10-30-5-reference-routes.md, id R09):
#   1. Use 2-socket resonators (Potent Chaotic Resonators) with a Pristine Fossil and a Shuddering Fossil until
#      the boots hold high Life and a Movement Speed.
#   2. Bench-craft the missing useful modifier: Movement Speed, in an open prefix.
#
# The guide starts from a rare pair of boots, as the target does (see `start_item` in the target).

name: R09, PoE Vault guide

rules:
  # Step 2: the Life is there, the boots have no Movement Speed and a prefix is open: craft it: the
  # plain Movement Speed craft of the bench, as the guide says.
  - when:
      rarity: rare
      requirements:
        - family: IncreasedLife
          status: passing
        - family: MovementVelocity
          status: absent
      open_prefixes: 1
    do: Bench craft #% increased Movement Speed
  # Step 1: use the two fossils again (this is also the first use).
  - when:
      rarity: rare
    do: Fossils Pristine Fossil + Shuddering Fossil
