# Given route for benchmark route R17: a +2 Lightning rare Talisman made with the rare-Talisman imprint (3.29).
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# In every state the FIRST rule whose conditions match is the one that is followed. A goal state is never
# acted on. A state no rule matches is reported as a gap: the guide does not say what to do there, and this
# file does not invent it. The conditions and actions are explained in examples/routes/r12-lightning-amulet.yaml;
# `imprints: n` matches a Talisman that holds exactly n imprints (#223).
#
# The route (Reddit, r/pathofexile, comments/1vtv3u0, 2026; docs/research/2026-10-30-5-reference-routes.md, id R17), from the
# bought Croaker Talisman (steps 1 to 3 make its implicit, see the target):
#   4. Orb of Alteration until "+1 to Level of all Skill Gems" (the one Orb of Transmutation that makes the Normal Talisman Magic
#      comes first: the game forces it before an Alteration).
#   5. Regal Orb.
#   6. "Imprint and annul to a 1-mod item with only +1 all skills left", "on fail: restore imprint and retry": the imprint is made
#      with the Fenumal Plagued Arachnid on the rare Talisman, an Orb of Annulment follows, and when it took the +1 the imprint is
#      restored. A restore uses the imprint up (ADR-0034), so the next try makes a new one first.
#   7. Craft "Can have up to 3 Crafted Modifiers", "Prefixes Cannot Be Changed" and "Cannot roll Attack Modifiers" (in that order:
#      the multimod lets the other two be crafted beside it).
#   8. "Harvest augment a new Lightning modifier and remove a random modifier", repeated "until +1 all Lightning skills". With the
#      prefixes locked the craft removes one of the three metamods (the only mods it may take: Harvest add/remove claims), and the
#      guide names no re-craft, so the craft is simply repeated, as written. A Talisman whose free prefixes are gone is a gap: the
#      craft has no room to add and the guide names no way on. Should a later craft take the +1 (its prefix lock taken first),
#      step 6's restore applies, as the guide's own rule for a lost +1. A Talisman back at 2 free prefixes after its prefix lock and
#      its Lightning prefix were taken meets step 7's rules again; where the bench refuses the craft there, it is a gap.
#   9. "Now you have +1 all skills and +1 to all lightning skills."
#  10. "Time to imprint and then exalt slam until you hit what you want. I made prefixes first then did suffixes." What he wanted is
#      the post's picture, the target (OR-58, #1289): one more prefix (maximum Energy Shield) and three suffixes (all Attributes,
#      Dexterity, Global Critical Strike Chance), each at its top tier. The rules: an imprint of the Talisman as it stands, an Exalted
#      Orb, and when the orb added anything but one of the four the imprint is restored and the step is tried again; when it added one
#      of the four the Talisman is imprinted anew (the new imprint replaces the old one) before the next orb.
#
# What step 10's rules read into the post (each a reading, said here):
#   * The metamods left of step 7 are taken off first (Remove Crafted Mods): the picture's Talisman holds six rolled mods and no
#     crafted one, and the post names no moment for it. NOT IN THE POST.
#   * "prefixes first then suffixes" is not kept as an order: an Exalted Orb cannot be aimed at a side, so a wanted suffix that comes
#     before the prefix is kept, which is never dearer.
#   * A Talisman that holds the +2 and is none of the kept states (an unwanted mod is on it) is restored from its imprint. After a
#     failed Exalted Orb that is the post's step. A Talisman that comes out of step 8 with an unwanted mod of the Harvest craft
#     (a Lightning Resistance, a Lightning Damage prefix) is the same state to these rules: with an imprint of step 6 still held it is
#     taken back to step 6, and with none it is a gap (the post names no way on).
#   * NOT IN THE POST: the Intrinsic Catalysts on the finished Talisman. The picture shows "Quality (Attribute Modifiers): +20%" and
#     the target asks it, but no step of the post makes it. Whether the picture's quality and its four other mods belong to the target
#     is asked of the owner (#1289's pull request): if not, step 10's rules and the catalyst rule go with the target's leaves.
#
# Counting mods: "only the +1" is 2 free prefixes and 3 free suffixes (the +1 is a prefix); the three metamods are suffixes.
name: R17, Reddit guide
skip_refused: true  # step 10: a rule whose action the game refuses falls through to the next that matches (an imprint of a state already held is refused, so the Exalted Orb follows it)

# The guide's cost with the start item, recorded on 2026-11-24 (#1567, #1596): these rules have gaps on today's target (#1503), so they never
# finish and price nothing; the same rules with a last `restart` (used 0.001 times per craft) cost 33,140.41 Chaos at the week-one prices,
# success 1 (an Orb of Annulment there instead: 33,139.61). The proof sentence compares the plan's cost with this figure, said as recorded.
recorded_cost: 33140.41
rules:
  # Step 4: the Normal Talisman is made Magic, then Alterations until the +1.
  - when:
      rarity: normal
    do: Orb of Transmutation
  - when:
      rarity: magic
      requirements:
        - family: GlobalSkillGemLevel
          status: passing
    do: Regal Orb
  - when:
      rarity: magic
    do: Orb of Alteration

  # Steps 9 and 10 (the +2 is on the Talisman). First the metamods left of step 7 come off (NOT IN THE POST, see above).
  - when:
      rarity: rare
      crafted_mods: true
      requirements:
        - family: GlobalSkillGemLevel
          status: passing
        - family: GlobalDamageTypeGemLevel
          status: passing
    do: Remove Crafted Mods
  # NOT IN THE POST (see above): the picture's 20% quality, on the Talisman that holds all six mods.
  - when:
      rarity: rare
      crafted_mods: false
      requirements:
        - family: GlobalSkillGemLevel
          status: passing
        - family: GlobalDamageTypeGemLevel
          status: passing
        - family: EnergyShieldPercent
          status: passing
        - family: AllAttributes
          status: passing
        - family: Dexterity
          status: passing
        - family: CriticalStrikeChanceIncrease
          status: passing
    do: Intrinsic Catalyst
  # Step 10, the kept states: the +2, any of the four wanted mods, and every other slot free (the free slots are counted, so no unwanted
  # mod is on the Talisman). In each: the imprint (the first one, or a new one in place of the old; refused when the Talisman is already
  # the state of its imprint), then the Exalted Orb.
  - when:
      rarity: rare
      crafted_mods: false
      open_suffixes: 3
      requirements:
        - family: GlobalSkillGemLevel
          status: passing
        - family: GlobalDamageTypeGemLevel
          status: passing
        - family: EnergyShieldPercent
          status: passing
    do: Imprint with the Fenumal Plagued Arachnid
  - when:
