# Given route for benchmark route R08: Dense + Shuddering Energy Shield boots.
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# It does not search for anything: in every state the FIRST rule whose conditions match is the one
# that is followed. A goal state is never acted on. A state no rule matches is reported as a gap.
# Lines starting with # are comments and are ignored. The conditions and actions are explained in
# examples/routes/r12-lightning-amulet.yaml.
#
# The route (PoE Vault, "Basic boots crafting", docs/research/2026-10-30-5-reference-routes.md, id R08):
#   1. Use Potent Chaotic Resonators with a Dense Fossil and a Shuddering Fossil until the boots hold high
#      Energy Shield and an included Movement Speed roll ("Ideally, you'll want an item with both a high Energy
#      Shield and an included movement speed roll").
#
# The guide's finished item is the target's (OR-58, #1289): the top tier of "#% increased Energy Shield" and the
# rolled 35% Movement Speed, so the one rule below is followed until the boots hold both. The guide's fallback
# ("If you end up with a high Energy Shield and no movement speed roll, you can always bench-craft the movement
# speed") is not the target, so no rule crafts Movement Speed: boots with a lower rolled speed or none are rolled
# again. The guide's optional finish ("You can either keep these or bench-craft the item to finish") names no mod
# and is no rule here (listed for the owner in #1289's pull request).
#
# The guide starts from a rare pair of boots, as the target does (see `start_item` in the target).

name: R08, PoE Vault guide

rules:
  # Step 1: use the two fossils (this is also the first use), until the target.
  - when:
      rarity: rare
    do: Fossils Dense Fossil + Shuddering Fossil
