# The route of R04 COMPLETED: r04-penetrating-quiver.yaml (the guide as written) plus the rules the guide does not have (ticket #599).
#
# The guide has 13 gaps and they are all one place: the metamod "Cannot roll Attack Modifiers" is on the quiver, the Pierce is fractured, the
# Strength and the arrow are there, and the prefixes are full of mods that are not the target's tiers (the two Exalted Orbs of its step 8 landed
# on a tier below the top one, or the prefixes were full before them). The guide says its two Exalted Orbs "guarantee" the prefixes, which is
# true of the families and not of the tiers (OR-4), so it has no word for what a player does next. A route with a gap never finishes, so the
# benchmark compares the planner with this route instead: the guide plus what a player does there, and `restart` last.
#
# What this file adds (each marked "NOT IN THE GUIDE" below):
#   a. The game refuses an essence while "Cannot roll Attack Modifiers" is on the quiver (the emulator's "Cannot be used on an item that has a
#      metamod (other than multimod) on it", our metamods.essence_refused), so with the craft on and no prefix to fill the player removes the
#      craft (Remove Crafted Mods, the guide's step 9, 0.37 Chaos) and is back at step 5 with the Pierce still fractured.
#   b. The metamod is crafted only when a prefix is free (step 8 reads "the remaining prefixes"); with the prefixes full the player rerolls
#      with the essence instead of paying for a craft that cannot be used.
#   c. The last rule `restart` (buy the quiver again) catches what is left: a state with no fractured Pierce that the guide's steps 2 to 4 do
#      not cover.
# Before #599 this file had the last rule only: every gap bought a new quiver and lost a fractured Pierce (1,041 Chaos of Fracturing Orbs at
# 1 in 4 on average), 297,863 Chaos in all against 209,294 with the additions. The guide's own rules below are unchanged except step 7's
# open prefix (b).
#
# The guide's route file, as it stands in r04-penetrating-quiver.yaml:
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# In every state the FIRST rule whose conditions match is the one that is followed. A goal state is never
# acted on. A state no rule matches is reported as a gap: the guide does not say what to do there, and this
# file does not invent it. The conditions and actions are explained in examples/routes/r12-lightning-amulet.yaml.
#
# The route (PoE Vault, docs/research/2026-10-30-5-reference-routes.md, id R04), as the guide numbers it:
#   1. Buy a quiver of item level 81 or more.
#   2. Essence of Insanity (the Pierce).
#   3. Orb of Annulment until the quiver has exactly 4 mods. If the Pierce is removed, go back to step 2.
#   4. Fracturing Orb on the Pierce (1 in 4). If it fractures another mod, go back to step 1.
#   5. Deafening Essence of Rage until "Bow Attacks fire an additional Arrow" (the essence gives the Strength).
#   6. Keep one suffix open, Annulment if needed. If the Strength or the arrow is removed, go back to step 5.
#   7. Craft "Cannot roll Attack Modifiers".
#   8. Two Exalted Orbs: the only prefixes left are Maximum Life and Damage with Bow Skills.
#   9. Remove the craft (the finish; not part of the target).
#
# Counting mods: a rare quiver always holds at least 4 mods in this route (an essence leaves 4, 5 or 6, and the
# route annuls down to 4 and no further), so "4 or fewer" is "at least 2 slots free in all", which the rules
# below write as the three ways to split 2 free slots over the two sides (the quiver has 3 prefixes, 3 suffixes).

name: R04 completed, PoE Vault guide
skip_refused: true  # a rule whose action the game refuses at a state falls through to the next that matches (the last one restarts)

rules:
  # Step 2: the bought quiver is normal; the Essence of Insanity makes it a rare with 4 mods.
  - when:
      rarity: normal
    do: Essence of Insanity

  # Steps 5 to 8 need the Pierce fractured: look at that first.
  # Step 8: the metamod is on the quiver, the Pierce is fractured, the Strength and the arrow are there:
  # an Exalted Orb while a prefix is free. (Prefixes full before the Exalted Orbs, or full of the wrong
  # tiers after them, is a gap of the guide: it names no way out.)
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: true
      open_prefixes: 1
      requirements:
        - family: Strength
          status: passing
        - family: AdditionalArrows
          status: passing
    do: Exalted Orb

  # NOT IN THE GUIDE (a): the metamod is on and no prefix is free for an Exalted Orb (the prefixes are full, of the wrong tiers or of other mods): the game refuses
  # an essence while "Cannot roll Attack Modifiers" is on the quiver, so take the craft off first (step 9 of the guide) and go back to step 5.
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: true
    do: Remove Crafted Mods

  # Step 7: a suffix is free for the metamod, the Strength and the arrow are there. NOT IN THE GUIDE (b): and a prefix is free for the Exalted Orbs of step 8.
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: false
      open_prefixes: 1
      open_suffixes: 1
      requirements:
        - family: Strength
          status: passing
        - family: AdditionalArrows
          status: passing
    do: Bench craft Cannot roll Attack Modifiers

  # NOT IN THE GUIDE (b): a suffix is free, the Strength and the arrow are there, but no prefix is: the metamod would be wasted, reroll with the essence.
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: false
      open_suffixes: 1
      requirements:
        - family: Strength
          status: passing
        - family: AdditionalArrows
          status: passing
    do: Deafening Essence of Rage

  # Step 6: no suffix free but the Strength and the arrow are there: an Orb of Annulment.
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: false
      requirements:
        - family: Strength
          status: passing
        - family: AdditionalArrows
          status: passing
    do: Orb of Annulment

  # Step 5, and back to it from step 6: the Strength or the arrow is missing.
  - when:
      rarity: rare
      fractured: [{family: Pierce}]
      crafted_mods: false
    do: Deafening Essence of Rage

  # Step 3: the Pierce was annulled (or the quiver was rerolled without it): back to step 2.
  - when:
      rarity: rare
      fractured: none
      requirements:
        - family: Pierce
          status: absent
      crafted_mods: false
    do: Essence of Insanity

  # Step 4 (exactly 4 mods, the Pierce there and not fractured yet): the Fracturing Orb, in the three ways
  # to leave 2 slots free.
  - when:
      rarity: rare
      fractured: none
      open_prefixes: 2
      requirements:
        - family: Pierce
          status: passing
    do: Fracturing Orb
  - when:
      rarity: rare
      fractured: none
      open_prefixes: 1
      open_suffixes: 1
      requirements:
        - family: Pierce
          status: passing
    do: Fracturing Orb
  - when:
      rarity: rare
      fractured: none
      open_suffixes: 2
      requirements:
        - family: Pierce
          status: passing
    do: Fracturing Orb

  # Step 3: more than 4 mods and the Pierce is there: an Orb of Annulment.
  - when:
      rarity: rare
      fractured: none
      requirements:
        - family: Pierce
          status: passing
    do: Orb of Annulment

  # Step 4: the Fracturing Orb fractured another mod (a mod is fractured and it is not the Pierce): back to step 1.
  # Any other state no rule covers is a gap of the guide.
  - when:
      rarity: rare
      fractured:
        without: [{family: Pierce}]
    do: restart

  # NOT IN THE GUIDE (c): any state no rule above covers: buy the start item again.
  - do: restart
