# Given route for benchmark route R13: an alt-regal belt with tier-1 life, two tier-1 resistances and a
# crafted damage modifier.
#
# A given route is a crafting route written down as rules and evaluated exactly, as a fixed policy,
# at the same prices as the solver's route (python -m crafting_system.cli TARGET.yaml --route ROUTE.yaml).
# It does not search for anything: in every state the FIRST rule whose conditions match is the one
# that is followed. A goal state is never acted on. A state no rule matches is reported as a gap.
# Lines starting with # are comments and are ignored. The conditions and actions are explained in
# examples/routes/r12-lightning-amulet.yaml.
#
# The route (Reddit, 2021, docs/research/2026-10-30-5-reference-routes.md, id R13):
#   1. Spam Orbs of Alteration on a magic belt until it holds tier-1 life and a tier-1 resistance.
#   2. Use a Regal Orb for the second tier-1 resistance. Restart (buy the belt again) if the Regal gives
#      anything else.
#   3. "Multi-mod damage": the bench's "Can have up to 3 Crafted Modifiers", then two damage crafts. The post's picture of the
#      finished belt (i.redd.it, read 2026-11-18 for #1289) names them: "30(24-32)% increased Elemental Damage with Attack
#      Skills" and "17(15-17)% increased Damage"; the author (comment hd8ejyz): "Basically it allows you to craft two mods on an
#      item instead of just one. Nice for this instance where I had 3 open slots to use."
#
# The guide starts from a magic belt and so does the target (#576), so no rule makes the belt magic. The guide's "tier-1 resistance" is any of fire, cold and
# lightning (the target asks for two of the three), and an unstated tier is the top tier (owner rule).
#
# The picture's belt also has "Quality (Attack Modifiers): +16%"; no step of the post makes it and the target does not ask it yet (see
# the target file), so no rule applies a catalyst.

name: R13, Reddit guide

rules:
  # Step 3, after the multimod: the two damage crafts the target names exactly (OR-2), in the two free prefixes.
  - when:
      rarity: rare
      requirements:
        - family: ItemGenerationCanHaveMultipleCraftedMods
          status: passing
        - family: AllDamage
          status: absent
    do: "Bench craft (15-17)% increased Damage"
  - when:
      rarity: rare
      requirements:
        - family: ItemGenerationCanHaveMultipleCraftedMods
          status: passing
        - family: IncreasedWeaponElementalDamagePercent
          status: absent
    do: "Bench craft (24-32)% increased Elemental Damage with Attack Skills"

  # Step 3: life and two tier-1 resistances are on the belt, in the three ways to pick two of the three: the multimod first.
  - when:
      rarity: rare
      crafted_mods: false
      requirements:
        - family: IncreasedLife
          status: passing
        - family: FireResistance
          status: passing
        - family: ColdResistance
          status: passing
    do: Bench craft Can have up to 3 Crafted Modifiers
  - when:
      rarity: rare
      crafted_mods: false
      requirements:
        - family: IncreasedLife
          status: passing
        - family: FireResistance
          status: passing
        - family: LightningResistance
          status: passing
    do: Bench craft Can have up to 3 Crafted Modifiers
  - when:
      rarity: rare
      crafted_mods: false
      requirements:
        - family: IncreasedLife
          status: passing
        - family: ColdResistance
          status: passing
        - family: LightningResistance
          status: passing
    do: Bench craft Can have up to 3 Crafted Modifiers

  # Step 2: a rare belt that is not one of those is a Regal that gave something else: buy the belt again.
  - when:
      rarity: rare
    do: restart

  # Step 2: tier-1 life and a tier-1 resistance on the magic belt: the Regal Orb.
  - when:
      rarity: magic
      requirements:
        - family: IncreasedLife
          status: passing
        - family: FireResistance
          status: passing
    do: Regal Orb
  - when:
      rarity: magic
      requirements:
        - family: IncreasedLife
          status: passing
        - family: ColdResistance
          status: passing
    do: Regal Orb
  - when:
      rarity: magic
      requirements:
        - family: IncreasedLife
          status: passing
        - family: LightningResistance
          status: passing
    do: Regal Orb

  # Step 1: the magic belt lacks them: Alteration again.
  - when:
      rarity: magic
    do: Orb of Alteration

