# Target for benchmark route R13: an alt-regal belt with tier-1 life, two tier-1 resistances and a
# crafted damage modifier.
#
# This file says WHAT you want to end with. It does not say how to craft it: the planner finds
# that. Lines starting with # are comments and are ignored.
#
# The route (Reddit, 2021): alteration spam (on a Magic belt) for tier-1 life and a resistance, a regal for another
# tier-1 resistance, then a multimod bench craft for the damage modifier.

# The base item: a Leather Belt, written by its English name as in the game. (When the game
# data has several bases with one name, the planner skips the Battle Royale copies; if that still
# leaves several, it asks you to write the base id instead, e.g. Metadata/Items/Belts/Belt3.)
base: Leather Belt

# The item level of the belt, a whole number from 1 to 100.
item_level: 86

# Where the crafting starts (OR-4, #545, #576). The post's first step is "Alt spam for T1 Life and a resist" (thread pq4owv, u/Fabere's "Rule 10"):
# an Orb of Alteration works on a Magic item only, and the post names no Transmutation Orb (a Normal start plus one would be a step the
# guide does not give, OR-16), so the start is a Magic Leather Belt. It is bought, and the post names none of its mods: it is the item the
# market sells (ADR-0064, OR-17), so it holds what an Orb of Alteration leaves on this base, 1 or 2 mods at their game weights, and the plan's
# first decision is made on each outcome of that draw (an Augmentation only where it holds one mod, an Alteration where it holds two).
start_item:
  rarity: magic

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it. Its price is that of a Magic belt (the key names "magic").
start: bought

# The kinds of actions the planner may use: the guide's orbs and the bench (the post names no Transmutation Orb, so none is offered). Without this line the
# planner also offers every other orb it can use, a Chaos Orb among them, and a belt rerolled that way
# has far more states than a plan can hold yet (more than 43,000 after four minutes, and a GitHub runner
# stopped the run with the pruning of ticket #118 in place); the plan is then the cheapest among the
# named kinds, and the report lists the kinds left out.
actions: [alteration-orb, augmentation-orb, regal-orb, bench-craft, remove-crafted-mods]

# Everything below must be present on the finished item.
requirements:
  # Post (Reddit, "Alt-Regal, just as Chris intended", thread pq4owv, u/Fabere's "Rule 10"): "Alt spam for T1 Life and a resist". A named
  # tier: tier 1. "family" is the game's own name for a group of mods that exclude each other.
  # min_tier: 1 means only the best tier counts (tier 1 is the BEST; min_tier: 2 would accept T1
  # and T2). not_crafted: true refuses a copy of the mod that came from the crafting bench.
  - family: IncreasedLife
    min_tier: 1
    not_crafted: true

  # "At least 2 of these 3": two tier-1 resistances out of fire, cold and lightning.
  # Post: "Alt spam for T1 Life and a resist" and "Regal for another T1 resist": the first resistance is tier 1 too.
  - at_least: 2
    of:
      - family: FireResistance
        min_tier: 1
        not_crafted: true
      - family: ColdResistance
        min_tier: 1
        not_crafted: true
      - family: LightningResistance
        min_tier: 1
        not_crafted: true

  # Post: "Multi-mod damage because I play softcore and hate defenses" (the research note's "crafted damage modifier"). It is made at the bench, so it has no natural tier, and OR-2 asks the exact
  # mod, not "any of N crafts": the craft the given route buys (examples/routes/r13-life-resist-belt.yaml,
  # "the highest one the belt's item level allows") is "(15-17)% increased Damage", mod JunMaster2AllDamage3
  # (needs item level 81; the belt is 86). The game data gives AllDamage a spawn weight of 0 on belts, so only the
  # bench can add it, and the bench copy is crafted by nature, so the line carries no not_crafted mark.
  - family: AllDamage
    mod: JunMaster2AllDamage3
