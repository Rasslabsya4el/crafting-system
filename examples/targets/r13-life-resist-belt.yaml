# Target for benchmark route R13: an alt-regal belt with tier-1 life, two tier-1 resistances and the multimod with
# two crafted damage modifiers.
#
# This file says WHAT you want to end with. It does not say how to craft it: the planner finds
# that. Lines starting with # are comments and are ignored.
#
# The route (Reddit, 2021, thread pq4owv, "Alt-Regal, just as Chris intended", u/Fabere's "Rule 10" comment): "1. Alt spam for
# T1 Life and a resist  2. Regal for another T1 resist  3. Multi-mod damage because I play softcore and hate defenses".
#
# The finished belt is the post itself: its picture (i.redd.it/y9c2oyb2m3o71.png, read 2026-11-18 for #1289) shows a Stygian
# Vise of item level 86, "Quality (Attack Modifiers): +16%", with exactly six mods:
#   prefix, tier 1:              +99(90-99) to maximum Life
#   master crafted prefix:       30(24-32)% increased Elemental Damage with Attack Skills (rank 2)
#   master crafted prefix:       17(15-17)% increased Damage
#   suffix, tier 1:              +48(46-48)% to Fire Resistance
#   suffix, tier 1:              +47(46-48)% to Cold Resistance
#   master crafted suffix:       Can have up to 3 Crafted Modifiers
# The author on the multimod, same thread: "Basically it allows you to craft two mods on an item instead of just one. Nice for
# this instance where I had 3 open slots to use." So "Multi-mod damage" is the multimod and these two crafts (OR-58). Until
# #1289 the file asked one craft, the (15-17)% increased Damage, and no multimod.
#   * The base: the picture's belt is a Stygian Vise; this file keeps the Leather Belt it has had since #19 (the research note
#     says "Rare Belt"), because the start item is priced for a Magic Leather Belt only. The two bases share the belt's mods.
#     Named for the owner and filed (see #1289's pull request).
#   * The quality: the picture shows 16% of the Abrasive type ("Attack Modifiers"); the post's three steps name no catalyst, but
#     the item is asked whole (OR-58), so the `quality:` block below asks it. Named for the owner in #1289's pull request.

# The base item: a Leather Belt, written by its English name as in the game. (When the game
# data has several bases with one name, the planner skips the Battle Royale copies; if that still
# leaves several, it asks you to write the base id instead, e.g. Metadata/Items/Belts/Belt3.)
base: Leather Belt

# The item level of the belt, a whole number from 1 to 100.
item_level: 86

# Where the crafting starts (OR-4, #545, #576). The post's first step is "Alt spam for T1 Life and a resist" (thread pq4owv, u/Fabere's "Rule 10"):
# an Orb of Alteration works on a Magic item only, and the post names no Transmutation Orb (a Normal start plus one would be a step the
# guide does not give, OR-16), so the start is a Magic Leather Belt. It is bought, and the post names none of its mods: it is the item the
# market sells (ADR-0064, OR-17), so it holds what an Orb of Alteration leaves on this base, 1 or 2 mods at their game weights, and the plan's
# first decision is made on each outcome of that draw (an Augmentation only where it holds one mod, an Alteration where it holds two).
start_item:
  rarity: magic

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it. Its price is that of a Magic belt (the key names "magic").
start: bought

# Everything below must be present on the finished item.
requirements:
  # Post (Reddit, "Alt-Regal, just as Chris intended", thread pq4owv, u/Fabere's "Rule 10"): "Alt spam for T1 Life and a resist". A named
  # tier: tier 1. "family" is the game's own name for a group of mods that exclude each other.
  # min_tier: 1 means only the best tier counts (tier 1 is the BEST; min_tier: 2 would accept T1
  # and T2). not_crafted: true refuses a copy of the mod that came from the crafting bench.
  - family: IncreasedLife
    min_tier: 1
    not_crafted: true

  # "At least 2 of these 3": two tier-1 resistances out of fire, cold and lightning.
  # Post: "Alt spam for T1 Life and a resist" and "Regal for another T1 resist": the first resistance is tier 1 too.
  - at_least: 2
    of:
      - family: FireResistance
        min_tier: 1
        not_crafted: true
      - family: ColdResistance
        min_tier: 1
        not_crafted: true
      - family: LightningResistance
        min_tier: 1
        not_crafted: true

  # Post: "Multi-mod damage because I play softcore and hate defenses". The picture of the finished belt names the three crafts
  # (see the head of this file); each is a bench mod with no natural tier, named by `mod:` (OR-2).
  # "17(15-17)% increased Damage", master crafted prefix (needs item level 81; the belt is 86).
  - family: AllDamage
    mod: JunMaster2AllDamage3
  # "30(24-32)% increased Elemental Damage with Attack Skills", master crafted prefix, rank 2 (the bench's top rank on a belt).
  - family: IncreasedWeaponElementalDamagePercent
    mod: EinharMasterWeaponElementalDamage2
  # "Can have up to 3 Crafted Modifiers", master crafted suffix: without it the belt holds one crafted mod.
  - family: ItemGenerationCanHaveMultipleCraftedMods
    mod: StrIntMasterItemGenerationCanHaveMultipleCraftedMods

# The catalyst quality of the picture's belt: "Quality (Attack Modifiers): +16%", the Abrasive type.
quality:
  type: abrasive
  min_percent: 16
