# Target for benchmark route R06: a Hunter-influenced Heavy Belt with a Life or Armour prefix, the
# top "% increased Attributes" and the Strength of a Deafening Essence of Rage as suffixes, a 42
# Strength implicit and 20% Intrinsic Catalyst quality.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (POEGuy / PoE Vault, "Strength-stacking influenced Heavy Belt", docs/research/
# 2026-10-30-5-reference-routes.md, id R06):
#   1. Buy a Hunter- or Elder-influenced Heavy Belt of item level 75 or more.
#   2. Use Deafening Essence of Rage until the belt has the top "% increased Attributes".
#   3. Use Orb of Annulment to remove unwanted modifiers and Exalted Orbs to add useful ones.
#   4. Apply 20 Intrinsic Catalysts; use a Divine Orb until "14% increased Attributes"; use a Blessed
#      Orb until the implicit is "42 Strength"; bench-craft an open modifier.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's
# rule for tiers: a mod whose tier the guide does not state is the TOP tier the item level allows
# (nobody crafts that without a guaranteed top-tier mod); a mod the guide's essence or bench craft
# forces is exactly that tier; a mod of the bought start item is the tier the buy spec prices.
#   * "Hunter or Elder": the guide allows both; this file takes Hunter. For Elder, write
#     `influence: [elder]` and, for the Attributes line, the Elder mod (PercentageAllAttributesUberElder2).
#   * "Tier 1 % Increased Attributes": on a Hunter belt of item level 75 it is "(10-12)% increased
#     Attributes" (mod PercentageAllAttributesInfluence2, tier 1 of the Hunter pool; its lower tier is
#     (6-9)%). The guide then uses a Divine Orb "until 14%": 14% is the 12 shown with 20% quality
#     (12 x 1.2 = 14.4, shown rounded down), so the roll asked is 12, the best the mod can give.
#   * "Tier 1 Strength": at item level 75 the natural Strength tops out at tier 3 ("+(43-50)"), so
#     the tier-1 Strength is the one the Deafening Essence of Rage adds, "+(51-58) to Strength" (mod
#     StrengthEssence7_), exactly that tier, as in the R05 example.
#   * "Life / Armour as available": at least one of Life and Armour, each at the top tier the item
#     level (75) allows: Life tier 1, "+(130-144)"; Armour tier 3, "+(323-400)" (its tiers 2 and 1
#     need item level 83 and 86). The guide ends with a bench craft of an open modifier, so a crafted
#     one counts too (the group has no not_crafted).
#   * "42 to Strength" (implicit): the Heavy Belt's own implicit, "+(25-35) to Strength" (mod
#     StrengthImplicitBelt1). A requirement compares the BASE roll the item stores, never the value
#     shown with quality (ADR-0027). The guide's 42 is shown with 20% Intrinsic quality:
#     35 x 1.2 = 42, so the base roll asked is 35, the top of the range (34 would show 40).
#   * "20% Intrinsic Catalyst quality": the `quality:` block below, 20 percent of the Intrinsic type.

# The base item, by its English name exactly as the game writes it (capital letters matter).
base: Heavy Belt

# The item level of the belt, a whole number from 1 to 100. The guide says "75+".
item_level: 75

# Influences on the base (shaper, elder, crusader, hunter, redeemer, warlord).
# The guide allows Hunter or Elder; this file takes Hunter.
influence: [hunter]

# Everything below must be present on the finished item (a list: every entry is required).
requirements:
  # "Life / Armour as available": at least 1 of these 2, each at the top tier the item level allows.
  - at_least: 1
    of:
      - family: IncreasedLife
        min_tier: 1
      - family: IncreasedPhysicalDamageReductionRating
        min_tier: 3

  # The top "% increased Attributes" of the Hunter pool, with the roll the Divine Orb aims at.
  # `mod` narrows the family to that one mod; `min_roll` is the base roll (see the readings above).
  - family: PercentageAllAttributes
    mod: PercentageAllAttributesInfluence2
    min_roll: 12

  # The Strength of the essence (see the readings above), exactly that tier. The bench Strength and
  # the natural tiers are other mods and do not count.
  - family: Strength
    mod: StrengthEssence7_

# The implicit the belt must show. `family: Strength` would also name the Strength implicits of the
# amulet and of the Battle Royale belt, so `mod` narrows it to the Heavy Belt's own.
implicits:
  - family: Strength
    mod: StrengthImplicitBelt1
    # The BASE roll, in the units of the game data: 35, the top of "+(25-35) to Strength". With the
    # 20% quality below it is shown as 42, the number the guide names.
    min_roll: 35

# The catalyst quality of the belt: 20 percent of the Intrinsic type (it scales attribute mods).
quality:
  type: intrinsic
  min_percent: 20
