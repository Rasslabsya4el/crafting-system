# Target for benchmark route R10: Intelligence-base boots with a fractured Movement Speed, an
# Intelligence suffix from a Shrieking Essence of Spite, a Life prefix and a crafted
# "#% chance to Avoid Elemental Ailments".
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Fractured Movement Speed intelligence boots", docs/research/
# 2026-10-30-5-reference-routes.md, id R10):
#   1. Buy boots with Movement Speed fractured. Use Shrieking Essence of Spite until the boots have
#      48 Intelligence, Life and an open suffix.
#   2. Craft "#% chance to Avoid Elemental Ailments" at the crafting bench in the open suffix.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's
# rule for tiers: a mod whose tier the guide does not state is the TOP tier the item level allows
# (nobody crafts that without a guaranteed top-tier mod); a mod the guide's essence or bench craft
# forces is exactly that tier; a mod of the bought start item is the tier the buy spec prices.
#   * "Intelligence base": boots whose armour is Energy Shield (they carry the game's int_armour tag).
#     The base below is Sorcerer Boots; every Intelligence boot base has the same pool of mods.
#   * "30%+ increased Movement Speed (fractured)": the fractured mod is the bought one, the 30%
#     tier (mod MovementVelocity5, tier 2); the buy spec prices a fractured Movement Speed of 30 or
#     more, and 30 is the cheapest of those. The guide accepts more than one bought mod here ("30%+");
#     at item level 84 the only one above 30 would need item level 86, so the file reads it as the 30%
#     one and makes up no other start. (Item level: the guide gives none.)
#   * "48 Intelligence from Shrieking Essence of Spite": exactly what that essence adds,
#     "+(43-50) to Intelligence" (mod Intelligence8, tier 2 on boots). The guide's priority list says
#     "+# to intelligence. We preferably want a roll of at least 40", and its step says "Once you hit 48
#     int and life, with an open suffix, you're done"; every roll of the essence (43 to 50) is above
#     the 40, and the 48 is read as the essence's usual roll, not as a minimum (the guide also says
#     "Whatever additional stats you get is pure bonus"), so no `min_roll` is written for it.
#   * "Life": "We want at least 70, but more is always better": a Life roll of 70 or more with no tier
#     (OR-4); see the requirement.
#   * The guide's priority list also names Lightning Resistance ("roughly 40%, but slightly lower values can do"), which the
#     steps do not work toward ("Whatever additional stats you get is pure bonus"), so it is not asked.
#   * "#% chance to Avoid Elemental Ailments": exactly the bench craft the guide uses, (16-20)%.
#   * "an open suffix for the craft": the item has three suffixes; the fractured prefix, the Life
#     prefix and the essence suffix leave room, so the planner may craft there.

# The base item, by its English name exactly as the game writes it (capital letters matter).
base: Sorcerer Boots

# The item level of the boots, a whole number from 1 to 100. The guide gives none; 84 lets every
# tier of every mod appear, as in the R12 example.
item_level: 84

# Influences on the base (shaper, elder, crusader, hunter, redeemer, warlord).
# [] means none.
influence: []

# Everything below must be present on the finished item (a list: every entry is required).
requirements:
  # The fractured Movement Speed. A family is the game's own name for the group of mods that exclude
  # each other. `mod` narrows it to one mod of the family, so exactly that tier: the 30% one. The
  # fractured mod of the start item counts, and no other mod of this family can be added next to it.
  - family: MovementVelocity
    mod: MovementVelocity5

  # The Intelligence of the Shrieking Essence of Spite (see the readings above), exactly that tier.
  - family: Intelligence
    mod: Intelligence8

  # Life with a rolled value of at least 70, rolled by the essence reforge, not crafted.
  # Guide (poe-vault.com/guides/ice-shot-deadeye-gear-jewels-and-flasks, "Boots"): "+# to maximum life. We want at least 70, but
  # more is always better." It names a number and no tier (OR-4), so the leaf is a `min_roll` with no tier: any tier whose roll
  # reaches 70 counts, and the top tier is not asked (it was, as `min_tier: 1`, before #404: 128 c against about 46 c). The
  # selector is the stat text, not the family: the Life family also holds two-stat mods, and one `min_roll` list cannot fit
  # mods with different numbers of stats. A Divine Orb rerolls the value inside its tier.
  - stat: "+# to maximum Life"
    min_roll: [70]
    not_crafted: true

  # "#% chance to Avoid Elemental Ailments", exactly the bench craft of the guide, (16-20)%
  # (mod EinharMasterAvoidElementalAilments1); the other tiers and the Loathing essence's copy do
  # not count.
  - family: AvoidElementalStatusAilments
    mod: EinharMasterAvoidElementalAilments1

# Where the crafting starts: boots that already have Movement Speed fractured.
start_item:
  rarity: rare
  mods:
    # The mod is named by its game-data id: MovementVelocity5 is "30% increased Movement Speed". The
    # file writes no tier: the tier is the game data's (OR-3).
    - mod: MovementVelocity5
      # One whole number per stat of the mod, in the units of the game data.
      values: [30]
      # Locked in place by a Fracturing Orb.
      fractured: true

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it.
start: bought
