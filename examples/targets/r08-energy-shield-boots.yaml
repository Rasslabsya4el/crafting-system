# Target for benchmark route R08: Dense + Shuddering Energy Shield boots.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Basic boots crafting", docs/research/2026-10-30-5-reference-routes.md, id R08):
#   1. Use Potent Chaotic Resonators with a Dense Fossil and a Shuddering Fossil until the boots hold high
#      Energy Shield and a desirable Movement Speed.
#   2. Bench-craft Movement Speed (or more Energy Shield) in an open affix.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's rule for
# tiers: a mod whose tier the guide does not state is the TOP tier the item level allows.
#   * "Sorcerer Boots, item level 86": an Intelligence base (Energy Shield armour). 86 is what the 35% Movement
#     Speed needs.
#   * "high Energy Shield": the "#% increased Energy Shield" prefix (family DefencesPercent) at its top tier, tier 1,
#     "(92-100)% increased Energy Shield" (mod LocalIncreasedEnergyShieldPercent7_, needs item level 84), rolled
#     and not crafted. The flat Energy Shield prefixes and the hybrid ones are not asked for. The guide says "high" and names
#     no tier ("Ideally, you'll want an item with both a high Energy Shield and an included movement speed roll"), so the
#     leaf has no `min_tier` and OR-1 holds (OR-4; it said `min_tier: 1` before #404, the same mod).
#   * "tier 1 movement speed, increasing your speed by 35%" or "bench-craft the movement speed": the rolled tier 1 (35%, mod
#     MovementVelocity6, needs item level 86; the guide: "You'll want a minimum item level of 86 so you'll be able to hit tier 1
#     movement speed"), or the bench's Movement Speed at its top tier: the plain craft, (20-24)% increased Movement Speed (mod
#     EinharMasterMovementVelocity3, needs item level 68), the craft the given route uses. The three hybrid crafts ((18-20)%
#     with "Cannot Be Chilled", with Onslaught on Kill, or with "if you haven't been Hit Recently") are not asked since #404: the
#     guide says "bench-craft the movement speed", it never offers a hybrid (OR-2, the R13 lesson). The lower tiers of the crafts
#     are not asked for.
#   * Start: a normal base of item level 86 bought on the trade site (poe.ninja lists no plain boots of that level)
#     and made rare with an Orb of Alchemy; see `start_item` below for how that is modelled.

# The base item, by its English name exactly as the game writes it (capital letters matter).
base: Sorcerer Boots

# The item level of the boots, a whole number from 1 to 100.
item_level: 86
# Not pinned (ADR-0061, ticket #352): the tier-1 Energy Shield % needs only item level 84 and the Movement Speed has a bench
# source, so the planner may plan the boots at 84 or 85 as well; this file's 86 is the guide's level, not the lowest.

# Influences on the base. [] means none.
influence: []

# The start: the rare boots the market sells (ADR-0064). The target names none of their mods, and the guide fossils a rare pair of boots, so the
# item is a bought Normal base made rare with an Orb of Alchemy, priced as that base plus the Alchemy (OR-16). It holds what an Orb of Alchemy
# leaves on the base: 4, 5 or 6 mods at their game weights. The plan opens with that draw and decides on each outcome of it; mods that no
# requirement asks for are junk, counted and not told apart (OR-10), and the first fossil erases whatever the rare holds.
start_item:
  rarity: rare
  mods: []

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it. The committed price is of a Normal base plus an Orb of Alchemy, not of this rare item (OR-16, #494 point 2).
start: bought

# The kinds of actions the planner may use: the guide's fossils (with their resonators) and the bench. The kinds not named are not offered, and the report says so: the
# plan is the cheapest among the named kinds. `fossil-set` is offered only when named.
actions: [fossil-set, bench-craft]

# Everything below must be present on the finished item.
requirements:
  # High Energy Shield, rolled: "#% increased Energy Shield". Guide (poe-vault.com/guides/crafting-basic-boots): "Ideally, you'll want an
  # item with both a high Energy Shield and an included movement speed roll". It names no tier, so OR-1 holds: the top tier.
  - family: DefencesPercent
    not_crafted: true

  # Movement Speed: the rolled tier 1 (35%), or the plain bench craft.
  # Guide: "You'll want a minimum item level of 86 so you'll be able to hit tier 1 movement speed, increasing your speed by 35%" and
  # "If you end up with a high Energy Shield and no movement speed roll, you can always bench-craft the movement speed".
  - at_least: 1
    of:
      - family: MovementVelocity
        min_tier: 1
        not_crafted: true
      - stat: "#% increased Movement Speed"
        mod: EinharMasterMovementVelocity3
