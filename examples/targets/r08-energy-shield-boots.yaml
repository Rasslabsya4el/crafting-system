# Target for reference route R08: Dense + Shuddering Energy Shield boots.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Basic boots crafting", docs/research/2026-10-30-5-reference-routes.md, id R08):
#   1. Use Potent Chaotic Resonators with a Dense Fossil and a Shuddering Fossil until the boots hold high
#      Energy Shield and a desirable Movement Speed.
#   2. Bench-craft Movement Speed (or more Energy Shield) in an open affix.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's rule for
# tiers: a mod whose tier the guide does not state is the TOP tier the item level allows.
#   * "Sorcerer Boots, item level 86": an Intelligence base (Energy Shield armour). 86 is what the 35% Movement
#     Speed needs.
#   * "high Energy Shield": the "#% increased Energy Shield" prefix (family DefencesPercent) at its top tier, "(92-100)%" (mod
#     LocalIncreasedEnergyShieldPercent7_, needs item level 84), rolled and not crafted. The guide says "high" and names no tier
#     ("Ideally, you'll want an item with both a high Energy Shield and an included movement speed roll"), so the tier is the top
#     one the item level allows (OR-1). From #901 to #1289 the leaf was `min_tier: 2`, "tier 1 or tier 2", by analogy to the owner's
#     reading of R10's Life (#895); no owner quote names tier 2 for these boots, so the analogy is gone (#1289). The flat Energy
#     Shield prefixes and the hybrid ones are not asked for: which mods "high Energy Shield" means beyond this one is a question
#     for the owner (listed in #1289's pull request), and none is made up.
#   * "an included movement speed roll": the rolled tier 1, 35% (mod MovementVelocity6, needs item level 86; the guide: "You'll
#     want a minimum item level of 86 so you'll be able to hit tier 1 movement speed, increasing your speed by 35%"), and only
#     that (OR-58). The guide's next sentence, "If you end up with a high Energy Shield and no movement speed roll, you can always
#     bench-craft the movement speed", is its fallback and not the item it aims at. Until #1289 the target took the bench's
#     (20-24)% as an equal alternative; the owner, 2026-11-18: «Что за идиотизм такой в результате либо т1 мувспид либо
#     крафченый 20-24? … Как такой крафт может вообще существовать?».
#   * The bench finish: the guide ends "Alternately, you can bench-craft additional Energy Shield if your item has other, desirable
#     modifiers" and "You can either keep these or bench-craft the item to finish". It leaves the craft to the player ("either
#     keep these or") and names it only for an item that has no rolled Movement Speed or that holds mods this file cannot name
#     ("other, desirable modifiers"), so no crafted mod and no open slot is asked (listed for the owner in #1289's pull request).
#   * Start: a normal base of item level 86 bought on the trade site (poe.ninja lists no plain boots of that level)
#     and made rare with an Orb of Alchemy; see `start_item` below for how that is modelled.

# The base item, by its English name exactly as the game writes it (capital letters matter).
base: Sorcerer Boots

# The item level of the boots, a whole number from 1 to 100.
item_level: 86
# The rolled 35% Movement Speed needs item level 86 (the tier-1 Energy Shield % needs 84), so the planner plans the boots at 86 and up.

# Influences on the base. [] means none.
influence: []

# The start: the rare boots the market sells (ADR-0064). The target names none of their mods, and the guide fossils a rare pair of boots, so the
# item is a bought Normal base made rare. Since #1522 the plan starts from the item its price was searched for (OR-43): the committed price is
# a Normal base's trade search, so the plan buys that Normal base and its own steps make it rare (an Orb of Alchemy, an essence or a fossil),
# each shown and paid (OR-16). Where the price is a Rare listing's, the plan opens instead with the draw of what an Orb of Alchemy leaves on the
# base (4, 5 or 6 mods at their game weights, ADR-0064); mods that no requirement asks for are junk, counted and not told apart (OR-10).
start_item:
  rarity: rare
  mods: []

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it. The committed price is of a Normal base, the item the plan starts from (OR-43, #1522); its row still adds an Alchemy that is a data fix of its own.
start: bought

# Everything below must be present on the finished item.
requirements:
  # High Energy Shield, rolled: "#% increased Energy Shield" at its top tier (no `min_tier`: OR-1; see the readings above).
  # Guide (poe-vault.com/guides/crafting-basic-boots): "Ideally, you'll want an item with both a high Energy Shield and an included
  # movement speed roll".
  - family: DefencesPercent
    not_crafted: true

  # Movement Speed: the rolled tier 1 (35%), and nothing in its place (OR-58).
  # Guide: "You'll want a minimum item level of 86 so you'll be able to hit tier 1 movement speed, increasing your speed by 35%".
  - family: MovementVelocity
    min_tier: 1
    not_crafted: true
