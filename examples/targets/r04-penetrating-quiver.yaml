# Target for benchmark route R04: the Insanity-fractured additional-arrow Penetrating Arrow Quiver.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft it: the
# planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Shrapnel Ballista Hierophant gear", docs/research/2026-10-30-5-reference-routes.md, id R04):
#   1. Buy a Penetrating Arrow Quiver of item level 81 or more (uncorrupted, unfractured, no influence).
#   2. Essence of Insanity, to guarantee "Projectiles Pierce 2 additional Targets"; Orb of Annulment until the
#      quiver has exactly 4 mods (buy a new quiver if the Pierce is annulled); Fracturing Orb on the Pierce
#      (25%, else buy a new quiver).
#   3. Deafening Essence of Rage until "Bow Attacks fire an additional Arrow" (the essence itself adds the
#      Strength); keep one suffix open (Annulment if needed).
#   4. Craft "Cannot roll Attack Modifiers"; two Exalted Orbs add Maximum Life and Increased Damage with
#      Bow Skills (the only prefixes left that are not attack mods); remove the craft.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's rule
# for tiers: a mod whose tier the guide does not state is the TOP tier the item level allows; a mod the
# guide's essence forces is exactly that tier.
#   * "Projectiles Pierce 2 additional Targets": exactly what the Essence of Insanity adds to a quiver
#     (mod AdditionalPierceEssence7, a prefix). It has to be fractured, so it stays through the reforges.
#   * "Tier 1 Strength": the Strength of the Deafening Essence of Rage, "+(51-58) to Strength" (mod
#     StrengthEssence7_, a suffix); a quiver has no other Strength, so it is the essence's.
#   * "Bow Attacks fire an additional Arrow": the only tier (AdditionalArrowQuiver1_, a suffix).
#   * "Maximum Life", "Increased Damage with Bow Skills": the guide names no tier, so the top tier the item level allows (OR-1),
#     rolled (not crafted).
#   * STEP#9, "Remove the "Cannot roll Attack Modifiers" crafted mod (with the Crafting Bench) and craft something useful like
#     Resistances or Attack Speed" (the guide's page, read 2026-11-18): the quiver the guide ends with holds that craft and no
#     metamod, so the target asks at least 1 of the bench's Resistance and Attack Speed crafts for a quiver, each at its top rank
#     (OR-1, OR-58): (29-35)% Fire, Cold or Lightning Resistance, or (7-12)% increased Attack Speed (the bench's only rank on a
#     quiver). An item holds one crafted mod without "Can have up to 3 Crafted Modifiers", so this line also means the metamod is
#     gone; the target language has no way to refuse a mod by name. The two-resistance crafts are not listed: the guide names
#     "Resistances or Attack Speed". Until #1289 the file called step 9 "a free choice", not part of the target.
#   * The guide's lists of "prefixes" and "suffixes" are not the item's sides: the Pierce is a prefix.

# The base item. The game data has two bases named Penetrating Arrow Quiver; the older one is flagged
# `trade_market_legacy_item`, so the id of the current one is written (its implicit is the same kind: Pierce).
base: Metadata/Items/Quivers/QuiverNew5

# The guide says item level 81 or more.
item_level: 81

influence: []

# Everything below must be present on the finished quiver.
requirements:
  # The Pierce of the Essence of Insanity, fractured. The fractured mod counts, and no other mod of the
  # family can be added next to it.
  - family: Pierce
    mod: AdditionalPierceEssence7
  # The Strength of the Deafening Essence of Rage.
  - family: Strength
    mod: StrengthEssence7_
  # Bow Attacks fire an additional Arrow.
  - family: AdditionalArrows
    mod: AdditionalArrowQuiver1_
  # Maximum Life, rolled, not crafted. The guide names no tier (step 8: "Use two Exalted Orb to guarantee Maximum Life and
  # Increased Damage with Bow Skills as your remaining prefix modifiers"), so there is no `min_tier` and OR-1 holds: the top tier
  # of the ladder at the item level. A guarantee is a guarantee of the family, not of its tier (OR-4, the "guarantee" bullet).
  - family: IncreasedLife
    not_crafted: true
  # Increased Damage with Bow Skills, rolled, not crafted. The guide names no tier (same step 8), so OR-1 holds: the top tier the
  # item level allows (tier 2 at item level 81, which `min_tier: 2` also wrote before #404).
  - family: DamageWithWeaponTypeSkill
    not_crafted: true
  # STEP#9 of the guide: the crafted suffix, which also means "Cannot roll Attack Modifiers" has been removed (OR-58).
  # Guide (poe-vault.com/guides/shrapnel-ballista-hierophant-gear-flasks, "Quiver"): "Remove the "Cannot roll Attack Modifiers"
  # crafted mod (with the Crafting Bench) and craft something useful like Resistances or Attack Speed."
  - at_least: 1
    of:
      - family: FireResistance
        mod: EinharMasterFireResist3_
      - family: ColdResistance
        mod: EinharMasterColdResist3__
      - family: LightningResistance
        mod: EinharMasterLightningResist3_
      - family: IncreasedAttackSpeed
        mod: EinharMasterAttackSpeed1

# Where the crafting starts (OR-4, #545). The guide's step 1 is "Buy a Penetrating Arrow Quiver with item level 81 or higher; uncorrupted,
# unfractured and no influence", and its step 2 is "Apply an Essence of Insanity": it names no rarity and no mod of the bought quiver,
# so the start is a plain (Normal) quiver of the base above, the one the Essence works on first. The quiver's other mods are
# whatever it was bought with (OR-17); the first essence rerolls them.
start_item:
  rarity: normal

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it. Its committed price is a stand-in (#426).
start: bought
