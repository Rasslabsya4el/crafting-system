# Target for benchmark route R11: an Evasion helmet with a fractured Chaos Resistance, the
# Mana Reservation Efficiency suffix of an Essence of Loathing, and Evasion and Life prefixes.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Fractured chaos-reservation helmet", docs/research/
# 2026-10-30-5-reference-routes.md, id R11):
#   1. Buy a helmet with Chaos Resistance fractured. Use Essences of Loathing, at least Shrieking,
#      until it has an open suffix and Evasion and Life prefixes you are happy with.
#   2. Finish with a crafted Resistance or Attribute.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's
# rule for tiers: a mod whose tier the guide does not state is the TOP tier the item level allows
# (nobody crafts that without a guaranteed top-tier mod); a mod the guide's essence or bench craft
# forces is exactly that tier; a mod of the bought start item is the tier the buy spec prices.
#   * "Evasion Helmet": a helmet whose armour is Evasion Rating (the Dexterity helmets, the game's
#     dex_armour tag). The base below is Lion Pelt.
#   * "Fractured Chaos Resistance": the guide says "Buy a Fractured Chaos Resistance Base" and names no
#     tier, so the leaf takes any tier (`min_tier: any`, as R12 does for its fractured resistance). The
#     start item below is the tier-1 one, +(31-35)%, the tier the buy spec prices (OR-3); the guide
#     accepts a cheaper tier of the fractured mod too, and the file makes up no second start item for it.
#   * "Evasion/Life prefixes you are happy with", "Total Evasion On Helmet - Ideally around 1900" and "+# to Maximum Life -
#     Ideally > 95": Evasion tier 1 to tier 3 and Life tier 1. This is the owner's reading of 2026-11-13 (ticket #895): he read
#     the page as a player and fixed the target, because a helmet with a low Evasion or Life tier is not one a player is happy
#     with. Before #895 the file read the guide as "any tier" of Evasion and a Life roll above 95 (tiers 1 to 3); before #404
#     it asked tier 1 of both. The Evasion leaf is the percentage prefix "#% increased Evasion Rating", (68-79)% or more; the
#     1900 is a total on the helmet (its base, quality, flat and percentage mods), not a roll of one mod, so it is not
#     written. The flat "+# to Evasion Rating" prefix and the hybrids (evasion with life, evasion with stun recovery) are not
#     counted. Life tier 1 on a helmet of item level 84 is +(130-144). Both are rolled, not from the bench.
#   * "Mana Reservation Efficiency from Loathing, at least Shrieking": the guide leaves the essence's tier to the crafter, so
#     the planner chooses between the Shrieking and the Deafening essence (see the entry below), and the route page shows the
#     one it chose in its steps, its prices and its finished item (#895).
#   * The two implicits of the guide (reduced mana cost of attacks, physical taken as lightning) are
#     Eldritch implicits, a different part of the work, and are left out. So is "finish with a
#     crafted Resistance or Attribute": the guide gives no number for it ("as needed"), so it asks
#     nothing of the item here.

# The base item, by its English name exactly as the game writes it (capital letters matter).
base: Lion Pelt

# The item level of the helmet, a whole number from 1 to 100. The guide gives none; 84 lets every
# tier of every mod appear, as in the R12 example.
item_level: 84

# Influences on the base (shaper, elder, crusader, hunter, redeemer, warlord).
# [] means none.
influence: []

# Everything below must be present on the finished item (a list: every entry is required).
requirements:
  # The fractured Chaos Resistance, any tier. The fractured mod of the start item counts.
  # Guide (poe-vault.com/guides/elemental-hit-of-the-spectrum-gear-flasks, "Helmet"): "Buy a Fractured Chaos Resistance Base, use
  # Essences of Loathing (at least Shrieking) until ...". It names no tier and accepts the base as it is sold, so `min_tier: any`
  # (OR-4; it said `min_tier: 1` before #404, which the start item still meets).
  - family: ChaosResistance
    min_tier: any

  # "#% increased Mana Reservation Efficiency of Skills", the suffix of Essence of Loathing.
  # Guide: "use Essences of Loathing (at least Shrieking)", so the essence is the Shrieking one or the Deafening one, the two the
  # guide names. Each forces exactly its own mod (OR-2): Shrieking (7-8)%, mod ManaReservationEfficiencyEssence6_, or Deafening
  # (9-10)%, mod ManaReservationEfficiencyEssence7. The Screaming essence (5-6%) is below "at least Shrieking" and does not count.
  # (It asked the Shrieking mod alone before #404; the given route still uses the Shrieking essence, the cheaper one.)
  - at_least: 1
    of:
      - family: ReducedManaReservationsCost
        mod: ManaReservationEfficiencyEssence6_
      - family: ReducedManaReservationsCost
        mod: ManaReservationEfficiencyEssence7

  # The Evasion prefix: the percentage prefix, tier 1 to tier 3 (`min_tier: 3` is the worst tier that counts), rolled, not
  # from the bench. Owner, 2026-11-13 (#895): "Evasion tier 1 to tier 3". The guide's own words: "until you hit an open Suffix
  # & Evasion/Life prefixes you are happy with" and "Total Evasion On Helmet - Ideally around 1900".
  - family: DefencesPercent
    min_tier: 3
    not_crafted: true

  # Life, tier 1, rolled by the essence reforge, not crafted. Owner, 2026-11-13 (#895): "Life tier 1". The guide's own words:
  # "+# to Maximum Life - Ideally > 95". The selector is the stat text, as in R10 (the Life family holds two-stat mods).
  - stat: "+# to maximum Life"
    min_tier: 1
    not_crafted: true

# Where the crafting starts: a helmet that already has Chaos Resistance fractured.
start_item:
  rarity: rare
  mods:
    # The mod is named by its game-data id: ChaosResist6 is "+(31-35)% to Chaos Resistance". The file
    # writes no tier: the tier is the game data's (OR-3).
    - mod: ChaosResist6
      # One whole number per stat of the mod, in the units of the game data.
      values: [33]
      # Locked in place by a Fracturing Orb.
      fractured: true

# The start item is bought. Its buy spec, trade query and price key are computed from this file
# (base, item level, influence, start item), so nothing else describes it.
start: bought
