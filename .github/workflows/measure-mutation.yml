name: Measure mutation

# Step 5 of the measurement chain (ticket #399): mutation testing of the core, to find the lines where the tests pass
# whatever the code does. A reusable workflow: `measure.yml` calls it after step 4. It fills the machines up to a
# deadline (2026-11-06 06:00 UTC), so it is built as a plan, 8 rounds and a summary:
#   plan     enumerates the mutants (an AST mutator of our own, .github/scripts/mutation_ops.py), orders them by module
#            priority, and picks each mutant's tests from step 3's data (artifact measure-coverage-data);
#   round N  up to 16 jobs (measure-mutation-round.yml), each of at most 320 minutes; a job takes the next pending
#            mutants (the ones no earlier round recorded) and stops starting new ones at the deadline. Workflow jobs
#            cannot loop, so the rounds are a fixed number of jobs, each needing the one before; a round that starts
#            after the deadline exits at once. 8 x 5.4 hours is 43 hours;
#   summary  merges every measure-mut-<round>-<job> into measure-mutation: summary.md, survivors.txt, headline.txt.
# Trial: one round, one job, 20 mutants of one small file, no waiting. Nothing in src/ changes on the branch: a job
# edits the checkout of its own (thrown-away) runner, one mutant at a time, and restores the file after each.

on:
  workflow_call:
    inputs:
      trial:
        type: boolean
        required: true
      deadline:
        description: 'No mutant starts after this time (UTC)'
        type: string
        required: false
        default: '2026-11-06T06:00:00Z'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/real-data
      - name: Install coverage (reads the per-test contexts)
        run: uv pip install "coverage==7.6.10"
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true  # step 3 may have failed: the plan then picks tests by import
        with:
          name: measure-coverage-data
          path: cov
      - name: Plan the mutants
        run: |
          args=(--out plan)
          if [ -f cov/.coverage ]; then args+=(--coverage cov/.coverage); else echo "No coverage data: tests are picked by import."; fi
          if [ "${{ inputs.trial }}" = "true" ]; then args+=(--trial); fi
          uv run --no-sync python .github/scripts/mutation_plan.py "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: measure-mutplan
          overwrite: true
          path: plan/plan.json

  round1:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 1
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round2:
    needs: [plan, round1]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 2
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round3:
    needs: [plan, round2]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 3
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round4:
    needs: [plan, round3]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 4
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round5:
    needs: [plan, round4]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 5
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round6:
    needs: [plan, round5]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 6
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round7:
    needs: [plan, round6]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 7
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  round8:
    needs: [plan, round7]
    if: ${{ !cancelled() && !inputs.trial && needs.plan.result == 'success' }}
    uses: ./.github/workflows/measure-mutation-round.yml
    with:
      round: 8
      trial: ${{ inputs.trial }}
      deadline: ${{ inputs.deadline }}

  summary:
    needs: [plan, round8]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: measure-mutplan
          path: plan
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true  # nothing to merge when no job got to run
        with:
          pattern: measure-mut-*
          path: results
      - name: Merge the results
        run: python3 .github/scripts/mutation_summary.py --plan plan/plan.json --results results --out out
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: measure-mutation
          overwrite: true
          path: out/
