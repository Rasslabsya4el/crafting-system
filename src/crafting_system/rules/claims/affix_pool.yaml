# Mechanic family: affix_pool (which mods a random add can pick from, and with what weight).
# The wiki's "group" is this project's "family". Claims about the single draw: research ticket #6
# (claims AFX-xx) and the owner decisions of issue #28 (Craft of Exile admitted, ADR-0005).
rules:
  - id: affix_pool.domain_match
    statement: A random add can only pick mods whose domain equals the domain of the item's base.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Mechanics_overview
    quote: "Mod domain governs the type of entity the modifier is going to appear and may confer some specific rules (such as the number of affixes)"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.side_is_generation_type
    statement: The mods a random add can pick have generation type prefix or suffix, and that value is the side the mod takes on the item. Other generation types (unique, corrupted, essence, crafted and so on) never enter this draw.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Mechanics_overview
    quote: "Mod generation type determines how the modifier is generated, for example whether it's a prefix, suffix, corrupted or always applied (like on unique items)"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.level_gate
    statement: A mod can be added only if its required level is at most the item level (a mod whose required level equals the item level is allowed).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Item_level#What_item_level_affects
    quote: "Magic and Rare items can only receive affixes which require a level less than or equal to the item's item level."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.spawn_weight_first_match
    statement: The spawn weight of a mod on an item is the weight of the first entry of the mod's own ordered spawn-weight list whose tag the item has; later matching entries are ignored and weight 0 removes the mod. The item's tags are the tags of its base plus the influence tags of its influences (affix_pool.influence_tags; an item without influence adds none).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Spawn_weight_tag
    quote: "If multiple tags apply, the left-most tags are most important, where the right most tags are the least."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.generation_weight_multiplier
    statement: The generation weights of a mod (365 attack mods carry them) are an ordered list read first-match like the spawn weights, and the value found multiplies the spawn weight by value/100 (the official note only says Sceptres, Staves, Rune Daggers and Wands roll attack mods less often). A mod without generation weights, or with no matching entry, keeps its spawn weight. The result stays an exact fraction, it is not rounded.
    source_kind: coe
    url: https://github.com/Rasslabsya4el/crafting-system/issues/28
    quote: "`generation_weights` as a ×value/100 multiplier"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: affix_pool.draw_proportional_to_weight
    statement: Among the mods that can still be added, the chance of each is its weight divided by the sum of the weights of all of them.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Weight#Overview
    quote: "if a modifier with a weight of 1000, and a total weight of 40,000, that modifier has a 2.5% chance to roll (1000/40,000)"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.one_pool_for_both_sides
    statement: While both sides have an open slot, one add draws from the prefixes and suffixes together, in one sum, with no first choice of a side (decision D2 of issue #28). Craft of Exile joins the two lists before drawing.
    source_kind: coe
    url: https://www.craftofexile.com/packages/package.js
    quote: "var tmodpool=tmodp_pre.concat(tmodp_suf)"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: affix_pool.full_side_closes
    statement: When an item holds as many prefixes (or suffixes) as its capacity allows, no mod of that side can be added, and the other side is the whole pool. Craft of Exile closes a side once its count reaches the capacity; the wiki only spells this out for the magic item (an Orb of Augmentation adds the missing type).
    source_kind: coe
    url: https://www.craftofexile.com/packages/package.js
    quote: "if(useaffbt.prefix>=usemaxaffgrp.prefix){blkdata.blktype.prefix=!0}"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: affix_pool.implicits_do_not_block
    statement: An implicit mod on the base does not remove explicit mods of its family from the pool, so only the explicit mods of an item block.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Version_history
    quote: "Implicit mods on items now do not stop explicit mods of the same type being spawned."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.values_uniform_integers
    statement: Each stat of a drawn mod rolls a uniform integer from its minimum to its maximum, both included. A stat whose minimum equals its maximum is fixed. Whether the stats of one mod roll independently is not admitted (research ticket #6, O-04); the sampler rolls them independently, and the exact chance that a hybrid mod meets a roll limit on several stats depends on it (the product of the per-stat chances): see claim divine_orb.hybrid_stats_roll_independently, which carries that assumption.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Mechanics_overview
    quote: "the actual value of the stat in the cases where minimum and maximum are not the same will be randomized within with equal chances"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.no_memory_strands
    statement: The planner's items carry no Memory Strands, so a draw is not tier-gated and the ordinary pool applies.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Memory_strand#Mechanics
    quote: "When crafting on an item with memory strands, it will consume a random amount of it to increase the tier of the modifier it adds to the item."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30

  - id: affix_pool.influence_tags
    statement: An influenced item has, besides the tags of its base, one tag per influence named "<class key>_<influence key>", and the spawn weights of an influence mod list such tags, so an influence mod joins the pool of an item with its tag and of no other (the weights of the ordinary mods do not change). The value maps each influence to its key (Hunter "basilisk", Redeemer "eyrie", Warlord "adjudicator") and each item class of the game data to its class key (a Thrusting One Hand Sword takes "sword" because its bases carry the base tag "sword" in the export and no influence tag with another sword-like prefix exists, so it can only draw the influence mods listed under "sword_<influence>"; ticket #68, read from the data, no source states it); an item class not listed has no admitted class key (jewels and flasks take no influence), so an influenced item of such a class is out of scope. The quote names Shaper; the other five keys and the 23 class keys are read from the data, where every one of the 138 influence tags in the spawn weights of the item-domain mods is one of these class keys with one of these influence keys, none missing or spare (research ticket 6, AFX-15). The tier of an influence mod counts among the mods of its type that can spawn with these tags (mod_tier.scope_is_mod_type); no source states it, it is the same rule on the influenced item.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Modifier#Terminology
    quote: 'Refers to Shaper influenced items, which have the "shaper" tag corresponding to the item class.'
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      influences: {shaper: shaper, elder: elder, crusader: crusader, hunter: basilisk, redeemer: eyrie, warlord: adjudicator}
      classes:
        Amulet: amulet
        Belt: belt
        Body Armour: body_armour
        Boots: boots
        Bow: bow
        Claw: claw
        Dagger: dagger
        Gloves: gloves
        Helmet: helmet
        One Hand Axe: axe
        One Hand Mace: mace
        One Hand Sword: sword
        Thrusting One Hand Sword: sword
        Quiver: quiver
        Ring: ring
        Rune Dagger: rune_dagger
        Sceptre: sceptre
        Shield: shield
        Staff: staff
        Two Hand Axe: 2h_axe
        Two Hand Mace: 2h_mace
        Two Hand Sword: 2h_sword
        Wand: wand
        Warstaff: warstaff

  - id: affix_pool.family_may_span_both_sides
    statement: A family may have mods on both sides. Five families of the base jewels (DamageForm, LifeLeech, ManaLeech, FormCritChance, FormCritMultiplier) and one of the abyss jewels (MinionLifeRegeneration) have mods of both generation types in the data; no item class of equipment has one in 3.29.3.3. Where both sides carry weight (DamageForm on the Cobalt and Viridian pools, MinionLifeRegeneration on the Ghastly Eye pool) the family exclusion holds across sides (affix_draw.family_exclusion), so a draw that takes a mod of the family on one side takes the family out of the pool on the other side as well, and a mod of the family on the item blocks both sides. The other four have no weight on one side.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Jewel
    quote: "Modifiers from the same group can not spawn together."
    patch_verified: "3.29.3.3"
    date_checked: 2026-11-01

  - id: affix_pool.royale_duplicates_do_not_spawn
    statement: >-
      Approximate. A mod of the export whose id holds the word "Royale" (the value's id_marker) is a Battle Royale copy and
      is not rolled by the game, so its spawn weight is 0 on every item: a pool, a tier table and a weight sum leave it out.
      The export has no field that marks these mods; the id is the only mark. In the pinned export 3.29.3.3, 139 mods carry it:
      135 have no spawn weight anyway (unique, chest, monster, area and flask mods), and four are copies of ordinary mods that have spawn weights on
      ordinary bases, MovementVelocity2Royale ("Sprinter's", prefix, level 5), IncreasedCastSpeed2Royale ("of Nimbleness"),
      IncreasedAttackSpeed2Royale and LocalIncreasedAttackSpeed2Royale____ (both "of Ease", suffixes, level 4). Evidence: on
      27,886 mods of the strand sheet the sheet's own count of tiers of a mod type (total_tiers) equals ours exactly when they are
      left out and is one lower for exactly the four mod types when they are in (31 of 1,834 mods in the foulborn and misc
      currency tab); the sheet's Unravelling weights for amulets (suffixes 125,250 at item levels 85 and 86) do not contain them;
      the total of the amulet suffix weights at item level 86 in the local copy of Craft of Exile is 125,250, ours was 126,050
      with them and is 125,250 without. Effect when they were in: the movement speed, cast speed and attack speed mod types had
      one tier too many and the pools a total too high (amulet suffixes by 800, wand suffixes by 1,500), which changes the cut
      of ADR-0040 and the chance of the Orb of Unravelling. No other leftover of another mode was found in the pools: the
      mods tagged for the Necropolis crafting need a base tag no ordinary base has (ticket #310).
    source_kind: experiment
    url: https://docs.google.com/spreadsheets/d/1UKTS29e1XghGTQQJBiu7TR3vrancnZxiyN3tBzj30WI/
    quote: "426,52,Foulborn Orb of Augmentation,of Grandmastery,1,4,252.5,0.2836879433,1"
    patch_verified: "3.29.3.3"
    date_checked: 2026-11-01
    approximate: true
    approximate_reason: "Three sources agree (the sheet's tier counts, the sheet's pool weights, Craft of Exile's totals); no first-party statement."
    value: {id_marker: Royale}
