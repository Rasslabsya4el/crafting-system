  - id: vendor.gem_qualification_is_uncorrupted_skill_gems
    statement: The wiki's rows ask for "quality gems" with the tag and give no rule for support gems, Awakened gems or corrupted gems. The planner counts uncorrupted skill gems only, the narrowest reading, until a source or a test says more.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "2 or more quality gems with a combined total of 40% quality & the Minion tag"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    approximate: true
    approximate_reason: "The wiki names no rule for support, Awakened or corrupted gems and no other source says."
    value:
      gem_kinds: [skill]
      corrupted_gems: false
