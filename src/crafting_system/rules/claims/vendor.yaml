  - id: vendor.jewellery_chaos_resistance_tier_up
    statement: A Ring or Amulet (Normal for the lowest tier; Normal, Magic or Rare holding an explicit chaos resistance mod for the next tier) + an Amethyst Flask + an Orb of Augmentation give a Magic ring or amulet with only the chaos resistance mod one tier higher, up to T2 (26-30%). The ladder is the six rungs of the chaos resistance family, of Bameth 31-35% (T1) out of reach.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "Magic Amulet or Ring with x% to Chaos Resistance one tier higher Maximum tier is Tier 2 ((26–30)% to Chaos Resistance)"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      base_kinds: [amulet, ring]
      flask: amethyst_flask
      orb: orb_of_augmentation
      max_tier_from_top: 2
      ladder:
        - {mod_id: ChaosResist1, required_level: 16, roll: [5, 10]}
        - {mod_id: ChaosResist2, required_level: 30, roll: [11, 15]}
        - {mod_id: ChaosResist3, required_level: 44, roll: [16, 20]}
        - {mod_id: ChaosResist4, required_level: 56, roll: [21, 25]}
        - {mod_id: ChaosResist5, required_level: 65, roll: [26, 30]}
        - {mod_id: ChaosResist6, required_level: 81, roll: [31, 35]}

  - id: vendor.tier_caps_match_the_datamined_ladders
    statement: Each cap the wiki gives names a real mod in the 3.29.3.3 data, which shows the wiki's tier counting is consistent with the ladders; it does not decide the elemental cap, because a T2 cap (Cremating, Entombing, Electrocuting, level 74/75) exists in the data too. The mods the wiki's caps land on are - movement speed T2 is MovementVelocity5 (required level 55, 30%), chaos resistance T2 is ChaosResist5 (65, 26-30%), added Physical Damage T2 is LocalAddedPhysicalDamage8 (65, one-hand), added Fire, Cold and Lightning T3 are LocalAddedFireDamage8 (62), LocalAddedColdDamage8 (63) and LocalAddedLightningDamage8 (63). The ladders have 6, 6, 9 and 10 tiers. Inference, not proof - every wiki cap lands at required level 55 to 65 with the next tier up at 74 or higher (movement speed 55 and 86; physical 65 and 77; chaos resistance 65 and 81; elemental T3 at 62/63 with T2 at 74/75), which fits the wiki's T3 for the elemental ladders.
    source_kind: datamined
    url: https://repoe-fork.github.io/mods.json
    quote: "MovementVelocity5 required_level 55 base_movement_velocity_+% 30..30 spawn_weights boots 1000; ChaosResist5 required_level 65 base_chaos_damage_resistance_% 26..30; LocalAddedPhysicalDamage8 required_level 65; LocalAddedFireDamage8 required_level 62"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      ladder_tiers: {movement_speed: 6, chaos_resistance: 6, physical: 9, fire: 10, cold: 10, lightning: 10}
      cap_mods:
        movement_speed: MovementVelocity5
        chaos_resistance: ChaosResist5
        physical_one_hand: LocalAddedPhysicalDamage8
        fire_one_hand: LocalAddedFireDamage8
        cold_one_hand: LocalAddedColdDamage8
        lightning_one_hand: LocalAddedLightningDamage8

  - id: vendor.spell_gem_level_weapon_recipe
    statement: A Normal Rune Dagger, Sceptre, Staff or Wand + two or more quality gems whose combined quality is 40% and that all carry the tag (Physical, Fire, Cold, Lightning or Chaos) give a Magic weapon with +1 to Level of all Spell Skill Gems of that tag (+2 on a staff). The wiki's notes exclude the warstaff and the generic dagger; the dagger and sceptre rows differ by tag (no Chaos version for the Sceptre in the data, see vendor.spell_gem_level_mods_in_the_data). The recipe takes no flask and no Orb of Augmentation.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "Magic Weapon with +1 to Level of all Fire Spell Skill Gems Magic Staff with +2 to Level of all Fire Spell Skill Gems Normal Rune Dagger/Sceptre/Staff/Wand 2 or more quality gems with a combined total of 40% quality & the Fire tag"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      input_rarity: normal
      gem_count_min: 2
      gem_quality_total: 40
      tags: [physical, fire, cold, lightning, chaos]
      bases: [rune_dagger, sceptre, staff, wand]

  - id: vendor.staff_spell_gem_recipe_gives_plus_two
    statement: Since 3.29.0 the staff version of the spell-gem recipe always gives +2 (the lowest tier of the staff mod became +2, so the recipe does too). The 3.29.0 patch notes do not mention it; the claim is the wiki's version history only, and the data agrees (the lowest staff rung is +2).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "The lowest tier for + physical/fire/cold/lightning/chaos skills on staff is now +2 instead of +(1-2), so the vendor recipe for a + skill level staff now always gives a +2 staff."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      staff_gem_level: 2

  - id: vendor.spell_gem_level_mods_in_the_data
    statement: The mods the spell-gem recipe produces are prefixes with required level 2 - Flame Shaper's, Frost Singer's, Thunderhand's (wand, sceptre, dagger, focus weight 250; staff two-hand version weight 1000), Lithomancer's (200 and 750), Mad Lord's (wand, dagger, focus 200, no sceptre; staff 750). On a staff the recipe gives the lowest of three rungs (+2, +3, +4), so tier 3 from the top. The helmet mod Taskmaster's (+1 Minion Skill Gems) is the lowest of two rungs (the other is Overseer's +2, level 75), a prefix of required level 14, helmet weight 250.
    source_kind: datamined
    url: https://repoe-fork.github.io/mods.json
    quote: "GlobalFireSpellGemsLevel1_ prefix 'Flame Shaper's' required_level 2 fire_spell_skill_gem_level_+ 1..1 spawn_weights wand 250, sceptre 250, dagger 250, focus 250; GlobalFireSpellGemsLevelTwoHand1__ fire_spell_skill_gem_level_+ 2..2 staff 1000; GlobalIncreaseMinionSpellSkillGemLevel1 'Taskmaster's' required_level 14 helmet 250"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      spell_gem_tags:
        physical:
          one_hand: {mod_id: GlobalPhysicalSpellGemsLevel1, required_level: 2, gem_level: 1, tier_from_top: 1, base_kinds: [rune_dagger, sceptre, wand]}
          staff: {mod_id: GlobalPhysicalSpellGemsLevelTwoHand1_, required_level: 2, gem_level: 2, tier_from_top: 3, base_kinds: [staff]}
        fire:
          one_hand: {mod_id: GlobalFireSpellGemsLevel1_, required_level: 2, gem_level: 1, tier_from_top: 1, base_kinds: [rune_dagger, sceptre, wand]}
          staff: {mod_id: GlobalFireSpellGemsLevelTwoHand1__, required_level: 2, gem_level: 2, tier_from_top: 3, base_kinds: [staff]}
        cold:
          one_hand: {mod_id: GlobalColdSpellGemsLevel1_, required_level: 2, gem_level: 1, tier_from_top: 1, base_kinds: [rune_dagger, sceptre, wand]}
          staff: {mod_id: GlobalColdSpellGemsLevelTwoHand1, required_level: 2, gem_level: 2, tier_from_top: 3, base_kinds: [staff]}
        lightning:
          one_hand: {mod_id: GlobalLightningSpellGemsLevel1, required_level: 2, gem_level: 1, tier_from_top: 1, base_kinds: [rune_dagger, sceptre, wand]}
          staff: {mod_id: GlobalLightningSpellGemsLevelTwoHand1, required_level: 2, gem_level: 2, tier_from_top: 3, base_kinds: [staff]}
        chaos:
          one_hand: {mod_id: GlobalChaosSpellGemsLevel1, required_level: 2, gem_level: 1, tier_from_top: 1, base_kinds: [rune_dagger, wand]}
          staff: {mod_id: GlobalChaosSpellGemsLevelTwoHand1, required_level: 2, gem_level: 2, tier_from_top: 3, base_kinds: [staff]}
      minion_helmet: {mod_id: GlobalIncreaseMinionSpellSkillGemLevel1, required_level: 14, gem_level: 1, tier_from_top: 2, base_kinds: [helmet]}

