# Vendor recipes as start-item sources (ADR-0059, ticket #329). Promoted from docs/research/2026-10-31-vendor-claims-draft/vendor.yaml
# (research #102): only the claims the five recipes of v1 need. Patch 3.29.3.3, checked 2026-10-31.
#
# The recipe data (crafting_system.items.vendor_recipes) reads the `value` of the claims below and holds no number of its own.
# A ladder lists the rungs of one mod family from the lowest tier to the top; the tier of a rung counted from the top is
# the length of the ladder minus its place (0-based). A tier-up recipe gives the rungs from the lowest up to the cap
# `max_tier_from_top`, one rung per recipe, each from the Magic item the recipe before it made.
rules:
  - id: vendor.recipe_makes_a_new_magic_item_with_one_mod
    statement: The tier-up vendor recipes (boots movement speed, weapon flat damage, jewellery chaos resistance) are of the "create new item" type. They turn the input into a new Magic item that holds only the recipe's one mod, whatever the rarity or the other mods of the input. The input's quality, sockets, links and influences are kept; enchantments, Eldritch implicits, Synthesised implicits, Incubators and Crucible trees are removed. The result's item level is a separate, unsettled claim (vendor.item_level_of_the_result_is_not_settled) and so is its base type (vendor.result_keeps_the_input_base_type).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "All recipes of this type create a new base item (with randomized base defences). The following are removed: enchantments, Eldritch implicits, Synthesised implicits, Incubators, Crucible passive trees. The following are retained: quality, sockets, links, item level, influences"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      result_rarity: magic
      result_mods: 1
      kept: [quality, sockets, links, influences]
      removed: [enchantments, eldritch_implicits, synthesised_implicits, incubators, crucible_trees]

  - id: vendor.refused_on_fractured_and_corrupted_inputs
    statement: A fractured or corrupted item cannot be the base item of the "create new item" or "modify existing item" recipes.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "Fractured items and corrupted items cannot be used as base items for these recipes."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      refused_base_states: [fractured, corrupted]

  - id: vendor.item_level_of_the_result_is_not_settled
    statement: Two wiki pages disagree in wording. The recipe page says the result takes the lowest item level among all the ingredients unless noted otherwise and, in the sections of the tier-up and gem recipes, lists item level as retained from the base item; the Item level page says modifying recipes "typically" keep the original item's level. Whether the flask or the gems (low-level goods) can lower the result's item level is therefore open. The planner carries the input's item level as the working assumption (the recipe data says so in `keeps_item_level`).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Item_level
    quote: "Recipes that modify an item's modifiers typically keep the original item's ilvl. The 5-to-1 vendor recipe causes the lowest ilvl item inputted to be used on the output item."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    approximate: true
    approximate_reason: "The two wiki pages disagree in wording and no other source settles whether the flask or the gems lower the result's item level."
    value:
      result_item_level: input

  - id: vendor.result_keeps_the_input_base_type
    statement: The wiki says the "create new item" recipes make a new base item with randomized base defences, and does not say whether the base type changes. The recipes name their output by item class ("Magic Boots", "Magic Weapon"), and the one first-hand Reddit thread (1lai4k4) is split (u/caddph "give you back your same weapon with a guaranteed mod" against u/Ekkzzo "generates a new item"). The planner keeps the input's base type; the defence rolls are not targets.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "All recipes of this type create a new base item (with randomized base defences)."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    approximate: true
    approximate_reason: "The wiki's wording does not say whether the base type stays, and the one Reddit thread that touches it is split."
    value:
      result_base_type: input

  - id: vendor.movement_speed_boots_tier_up
    statement: Boots (Normal for the lowest tier; Normal, Magic or Rare holding an explicit movement speed mod for the next tier) + a Quicksilver Flask + an Orb of Augmentation give Magic boots with only the movement speed mod one tier higher, up to Cheetah's (T2, 30%). From Normal boots the first result is the lowest tier (10%), so 30% takes five recipes in a row. The ladder is the six rungs of the movement speed family in the 3.29.3.3 data, Hellion's 35% (T1) out of reach.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Quicksilver_Flask
    quote: "This recipe outputs Magic Boots with 5% higher movement speed (and no other modifiers), up to a maximum of 30% (Cheetah's; T2)."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      base_kinds: [boots]
      flask: quicksilver_flask
      orb: orb_of_augmentation
      max_tier_from_top: 2
      ladder:
        - {mod_id: MovementVelocity1, required_level: 1, roll: [10, 10]}
        - {mod_id: MovementVelocity2, required_level: 15, roll: [15, 15]}
        - {mod_id: MovementVelocity3, required_level: 30, roll: [20, 20]}
        - {mod_id: MovementVelocity4, required_level: 40, roll: [25, 25]}
        - {mod_id: MovementVelocity5, required_level: 55, roll: [30, 30]}
        - {mod_id: MovementVelocity6, required_level: 86, roll: [35, 35]}

  - id: vendor.weapon_flat_damage_tier_up
    statement: A weapon (Normal for the lowest tier; Normal, Magic or Rare holding the explicit added Physical Damage mod for the next tier) + a Granite Flask + an Orb of Augmentation give a Magic weapon with only that mod one tier higher, up to T2 (wiki; Craft of Exile agrees, maxtier 2). A hybrid local damage mod does not work. One-hand and two-hand weapons have their own ladders of nine rungs each (the one-hand classes, wands and sceptres included, take the one-hand ladder); the cap is the same tier counted from the top. The elemental versions are their own claim (vendor.weapon_elemental_damage_tier_up) because the sources disagree on their cap.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "Magic Weapon with x added Physical Damage one tier higher Maximum tier is Tier 2"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    value:
      base_kinds:
        one_hand: [claw, dagger, one_hand_axe, one_hand_mace, one_hand_sword, rune_dagger, sceptre, thrusting_one_hand_sword, wand]
        two_hand: [bow, staff, two_hand_axe, two_hand_mace, two_hand_sword, warstaff]
      flask: granite_flask
      orb: orb_of_augmentation
      max_tier_from_top: 2
      ladders:
        one_hand:
          - {mod_id: LocalAddedPhysicalDamage1, required_level: 2}
          - {mod_id: LocalAddedPhysicalDamage2, required_level: 13}
          - {mod_id: LocalAddedPhysicalDamage3, required_level: 21}
          - {mod_id: LocalAddedPhysicalDamage4, required_level: 29}
          - {mod_id: LocalAddedPhysicalDamage5, required_level: 36}
          - {mod_id: LocalAddedPhysicalDamage6, required_level: 46}
          - {mod_id: LocalAddedPhysicalDamage7, required_level: 54}
          - {mod_id: LocalAddedPhysicalDamage8, required_level: 65}
          - {mod_id: LocalAddedPhysicalDamage9, required_level: 77}
        two_hand:
          - {mod_id: LocalAddedPhysicalDamageTwoHand1, required_level: 2}
          - {mod_id: LocalAddedPhysicalDamageTwoHand2, required_level: 13}
          - {mod_id: LocalAddedPhysicalDamageTwoHand3, required_level: 21}
          - {mod_id: LocalAddedPhysicalDamageTwoHand4, required_level: 29}
          - {mod_id: LocalAddedPhysicalDamageTwoHand5, required_level: 36}
          - {mod_id: LocalAddedPhysicalDamageTwoHand6, required_level: 46}
          - {mod_id: LocalAddedPhysicalDamageTwoHand7, required_level: 54}
          - {mod_id: LocalAddedPhysicalDamageTwoHand8, required_level: 65}
          - {mod_id: LocalAddedPhysicalDamageTwoHand9, required_level: 77}

  - id: vendor.weapon_elemental_damage_tier_up
    statement: A weapon (same inputs rule as the physical recipe) + a Ruby (Fire), Sapphire (Cold) or Topaz (Lightning) Flask + an Orb of Augmentation give a Magic weapon with only that added elemental damage mod one tier higher. The cap is a rule axis of two readings. The wiki says T3 ("Maximum tier is Tier 3"); Craft of Exile's table has maxtier 2 for these three (and for every tier-up recipe), and no other source decides. The data holds both, a T3 rung (62/63/63) and a T2 rung (74/75/74). The plan reads the wiki (T3, eight recipes from Normal); the other reading (T2, nine recipes) is the second model of the axis. A hybrid local damage mod does not work. The ladders have ten rungs (the level-82 Ravaging rung of the deepwater sword is not one of them).
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Vendor_recipe_system
    quote: "Wiki: Magic Weapon with x added Fire Damage one tier higher Maximum tier is Tier 3. Craft of Exile package.js, the fire recipe: {\"id\":1972,\"tier\":\"+\",\"maxtier\":2}"
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31
    approximate: true
    approximate_reason: "The wiki caps the elemental recipes at T3 and Craft of Exile at T2; no other source decides, so the cap is a rule axis of two readings."
    value:
      base_kinds:
        one_hand: [claw, dagger, one_hand_axe, one_hand_mace, one_hand_sword, rune_dagger, sceptre, thrusting_one_hand_sword, wand]
        two_hand: [bow, staff, two_hand_axe, two_hand_mace, two_hand_sword, warstaff]
