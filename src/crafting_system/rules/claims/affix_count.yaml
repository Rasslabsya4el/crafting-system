# Mechanic family: affix_count (how many affixes an item ends up with).
# The wiki's "group" is this project's "family".
rules:
  - id: affix_count.rare_reroll_ratio
    statement: For regular items (not jewels), a Chaos Orb rerolls a rare item to 4, 5 or 6 affixes in the ratio 8:3:1.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Chaos_Orb#Mechanics
    quote: "For regular items, Chaos Orbs result in a rare item with an affix count of 4, 5, or 6 at a ratio of 8:3:1."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-30
    value: {4: 8, 5: 3, 6: 1}
