# Mechanic family: influence_beast (the six beast recipes "Add a Mod to a <influence> Item").
# Research ticket #86 (claims INF-26 and INF-27, draft file docs/research/2026-10-31-influence-claims.yaml on the branch
# research/influence, commit 3964011), the decisions of grill B2 (issue #93, ADR-0030) and ticket #154.
#
# APPROXIMATE (ADR-0028): one guide (Maxroll, 2025-06-13, patch 3.26) says these recipes add a mod as an Exalted Orb does on the
# influenced item, not always a mod of the influence (#1538); a single secondary source, so the claim keeps the approximate mark.
rules:
  - id: influence_beast.recipes
    statement: "Six beast recipes add a mod to an item of one influence. The value maps the influence to the beasts one use consumes, as a price-file name and a count: the named red beast of the influence, a Craicic Maw, and two rare beasts of any kind (the Blood Altar takes four beasts per recipe, named red beasts first and any rare beast for the rest); `any_rare_creature` is priced at the setting beastcraft.any_rare_creature_price."
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Beastcrafting
    quote: "Add a Mod to a Shaper Item"
    patch_verified: "3.29.3.3"
    date_checked: 2026-11-01
    value:
      shaper: {Fenumal Devourer: 1, Craicic Maw: 1, any_rare_creature: 2}
      elder: {Saqawine Blood Viper: 1, Craicic Maw: 1, any_rare_creature: 2}
      crusader: {Farric Goliath: 1, Craicic Maw: 1, any_rare_creature: 2}
      hunter: {Craicic Watcher: 1, Craicic Maw: 1, any_rare_creature: 2}
      redeemer: {Fenumal Queen: 1, Craicic Maw: 1, any_rare_creature: 2}
      warlord: {Fenumal Scrabbler: 1, Craicic Maw: 1, any_rare_creature: 2}

  - id: influence_beast.uses_item_level
    statement: "A beast recipe that adds a mod uses the item's item level, as other recipes that add mods do."
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Beastcrafting
    quote: "Other recipes that add modifiers use the item's item level as usual."
    patch_verified: "3.29.3.3"
    date_checked: 2026-11-01

  - id: influence_beast.adds_a_mod_of_that_influence
    statement: "The recipe of an influence works on a rare item that already has that influence and adds one mod to it as a plain Exalted Orb does on that item: drawn from the item's whole pool (the mods of its base and the mods of its influences, each at its spawn weight), through the item level, the families on the item, the side capacity, the Prefixes/Suffixes Cannot Be Changed locks with open slots still filled, and the Cannot roll Attack/Caster Modifiers blocks. It does not guarantee a mod of the influence. It needs an open slot, and no legal mod means the recipe is refused. Nothing is added to the influences. One guide says so (Maxroll's Beastcrafting Guide); the wiki and the export name the recipe only."
    source_kind: wiki  # a secondary guide; the registry has no kind for one, and recombinator_cost.bench_rank_discount files a Maxroll guide so too
    url: https://maxroll.gg/poe/crafting/beastcrafting
    quote: "An influence slam adds a modifier to an influenced item. It is functionally the same as an Exalted Orb. It does not guarantee an influenced modifier."
    patch_verified: "3.26.0"  # the patch the guide says it is updated for (dateModified 2025-06-13)
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: "One secondary source: a single guide (Maxroll's Beastcrafting Guide, dated 2025-06-13, updated for 3.26) says the recipe is functionally an Exalted Orb on the influenced item; no wiki text or patch note confirms it, and no source says otherwise (#1538). The guide is of 3.26; nothing read says whether 3.27 to 3.29 changed the recipe."
    page_statement: "A beast's influence recipe adds one mod to an item of that influence as an Exalted Orb would: any mod of the item's pool, not always one of the influence."
    page_source: "one guide (Maxroll's Beastcrafting Guide, 2025-06-13) says so; no wiki text confirms it"

  - id: influence_beast.refused_on_corrupted
    statement: "A corrupted item takes no beast influence recipe."
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Corrupted#Modifying_corrupted_items
    quote: "Corrupted items cannot be modified, with the following exceptions:"
    patch_verified: "3.29.3.3"
    date_checked: 2026-11-01
