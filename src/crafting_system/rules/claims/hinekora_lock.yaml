  # --- the price ---

  - id: hinekora_lock.cost
    statement: One use of a Hinekora's Lock consumes one Hinekora's Lock item; the value maps its price-file name (the item's name in the game data) to the number of items.
    source_kind: datamined
    url: https://repoe-fork.github.io/base_items.json
    quote: 'Metadata/Items/Currency/CurrencyHinekorasLock: name "Hinekora''s Lock"'
