<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');
    :root {
      color-scheme: dark;
      --bg: #0a0806;
      --panel: #17110b;
      --panel-2: #120d08;
      --frame: #8a6a3a;
      --frame-soft: #4a3a22;
      --ink: #ece3d2;
      --muted: #a4927a;
      --rare: #ffff77;
      --magic: #8888ff;
      --mod: #b9c4ff;
      --added: #6ee06e;
      --removed: #ff7676;
      --warn: #e0b64a;
      --bad: #ff8f8f;
      --good: #6ee06e;
      --heading-font: 'Cinzel', Georgia, 'Times New Roman', serif;
      --body-font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body { margin: 0; color: var(--ink); font: 16px/1.5 var(--body-font); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-family: var(--heading-font); letter-spacing: .04em; font-size: 1.7rem; margin: 0 0 18px; }
    h2 { font-family: var(--heading-font); letter-spacing: .03em; font-size: 1.15rem; margin: 26px 0 12px; color: var(--rare); }
    section { margin: 18px 0; padding: 16px; border: 1px solid var(--frame-soft); border-radius: 6px; background: var(--panel); }
    p { margin: 8px 0; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    a { color: #d9b96a; }
    footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--frame-soft); }

    /* item tooltip card */
    .tooltip-card { background: linear-gradient(var(--panel-2), var(--panel-2)) padding-box, linear-gradient(160deg, var(--frame), var(--frame-soft)) border-box; border: 1px solid transparent; border-radius: 6px; padding: 14px 18px 16px; max-width: 560px; }
    .tt-header { font-family: var(--heading-font); text-align: center; font-size: 1.2rem; letter-spacing: .03em; padding-bottom: 8px; border-bottom: 1px solid var(--frame-soft); margin-bottom: 8px; }
    .tt-rare { color: var(--rare); }
    .tt-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
    .tt-badge { text-align: center; color: var(--bad); font-size: .85rem; }
    .tt-mods { margin-top: 8px; }
    .tt-mod { padding: 6px 0; border-top: 1px solid var(--frame-soft); }
    .tt-mod:first-child { border-top: 0; }
    .tt-mod-kind { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .tt-mod-text { color: var(--mod); }
    .tt-any-label { color: var(--muted); }
    .tt-mod-inline { color: var(--mod); }
    .tt-note { color: var(--muted); font-size: .85rem; }
    .tt-tag { font-size: .72rem; padding: 1px 6px; border-radius: 3px; margin-right: 6px; font-weight: 600; }
    .tt-tag-added { background: rgba(110,224,110,.18); color: var(--added); }
    .tt-tag-removed { background: rgba(255,118,118,.18); color: var(--removed); }
    .tt-added .tt-mod-text, .tt-added { color: var(--added); }
    .tooltip-example { margin-top: 10px; }

    /* currency chips */
    .chip { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 999px; font-size: .8rem; border: 1px solid var(--frame-soft); }
    .chip-orb { background: #22303a; color: #bfe3ea; }
    .chip-essence { background: #2e2140; color: #d6b9ff; }
    .chip-fossil { background: #3a2c1a; color: #e0c090; }
    .chip-resonator { background: #3a2410; color: #f0a860; }
    .chip-harvest { background: #1e3520; color: #a6e0a6; }
    .chip-fracturing { background: #401e28; color: #f0a0b8; }
    .chip-base { background: #262626; color: #cfcfcf; }

    /* routes list (CSS-only tab selection, no script) */
    .route-tab { position: absolute; opacity: 0; pointer-events: none; }
    .route-row { display: block; cursor: pointer; padding: 10px 12px; border: 1px solid var(--frame-soft); border-radius: 6px; margin-bottom: 8px; background: var(--panel-2); }
    .route-tab:checked + .route-row { border-color: var(--frame); background: #221a10; }
    .route-tab:focus-visible + .route-row { outline: 2px solid var(--rare); }
    .route-title { font-weight: 600; margin-bottom: 4px; }
    .route-chance { color: var(--muted); font-size: .85rem; margin: 4px 0; }
    .route-costs { font-size: .9rem; margin-top: 4px; }
    details.show-all > summary { cursor: pointer; color: #d9b96a; margin: 6px 0; }
    .route-panel { padding-top: 4px; }

    /* crafting flow */
    .flow-scroll { overflow-x: auto; padding-bottom: 6px; }
    .flow-track { display: flex; align-items: flex-start; gap: 6px; min-width: max-content; padding: 6px 2px; }
    .flow-step { width: 190px; flex: 0 0 auto; border: 1px solid var(--frame-soft); border-radius: 6px; background: var(--panel-2); padding: 8px 10px; }
    .flow-title { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .flow-chip { display: inline-block; margin: 4px 0; padding: 3px 8px; border-radius: 4px; font-size: .85rem; font-weight: 600; }
    .flow-chip-orb { background: #22303a; color: #bfe3ea; }
    .flow-chip-essence { background: #2e2140; color: #d6b9ff; }
    .flow-chip-fossil { background: #3a2c1a; color: #e0c090; }
    .flow-chip-resonator { background: #3a2410; color: #f0a860; }
    .flow-chip-harvest { background: #1e3520; color: #a6e0a6; }
    .flow-chip-fracturing { background: #401e28; color: #f0a0b8; }
    .flow-meta { font-size: .78rem; color: var(--muted); }
    .flow-badge { margin-top: 6px; font-size: .76rem; padding: 3px 6px; border-radius: 4px; }
    .flow-success { background: rgba(110,224,110,.15); color: var(--added); }
    .flow-repeat { background: rgba(224,182,74,.15); color: var(--warn); }
    .flow-reset { background: rgba(224,182,74,.15); color: var(--warn); }
    .flow-restart { background: rgba(255,118,118,.15); color: var(--bad); }
    .flow-forward { background: #22303a; color: #bfe3ea; }
    .flow-arrow { flex: 0 0 auto; width: 90px; text-align: center; padding-top: 34px; color: var(--muted); font-size: 1.1rem; position: relative; }
    .flow-cond { display: block; font-size: .72rem; color: var(--muted); line-height: 1.25; margin-top: 2px; white-space: normal; }
    .flow-house { margin-top: 10px; font-size: .82rem; color: var(--bad); }

    /* step by step + example */
    .steps-with-example { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .steps { flex: 1 1 320px; padding-left: 22px; margin: 0; }
    .steps li + li { margin-top: 8px; }
    .tooltip-example { flex: 0 0 auto; }

    /* tables */
    .table-wrap { overflow-x: auto; border: 1px solid var(--frame-soft); margin: 8px 0; }
    table { width: 100%; min-width: 480px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--frame-soft); }
    th { color: var(--muted); font-size: .85rem; font-weight: 650; }
    tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--frame); }
    tr:last-child td { border-bottom: 0; }
    details summary { cursor: pointer; color: #d9b96a; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #0b0806; border: 1px solid var(--frame-soft); font-size: .82rem; }

    @media (max-width: 640px) {
      main { padding: 16px 12px 50px; }
      .flow-step { width: 160px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{REPORT_TITLE}}</h1>
    {{REPORT_BODY}}
  </main>
</body>
</html>
