# Target for benchmark route S12 (a TEST ROUTE, not a published one), R05's ring on a base with 60 strands: a budget ring with a fractured "+12-16 to All Attributes", the
# Strength of a Deafening Essence of Rage, and a Life or Resistance modifier.
#
# This file says WHAT you want to end with and WHAT you start from. It does not say how to craft
# it: the planner finds that. Lines starting with # are comments and are ignored.
#
# The route (PoE Vault, "Budget fractured all-attributes Strength ring", docs/research/
# 2026-10-30-5-reference-routes.md, id R05):
#   1. Buy a rare ring of item level 75 or more with "+12-16 to All Attributes" fractured.
#   2. Use Deafening Essence of Rage until the other modifiers are useful ones, such as Maximum
#      Life or Resistances.
#   3. Apply 20 Intrinsic Catalysts and use the crafting bench on any open modifier.
#
# How the words of the guide are read (each reading is a choice and can be changed here). The owner's
# rule for tiers: a mod whose tier the guide does not state is the TOP tier the item level allows
# (nobody crafts that without a guaranteed top-tier mod); a mod the guide's essence or bench craft
# forces is exactly that tier; a mod of the bought start item is the tier the buy spec prices.
#   * "+12-16 to All Attributes": the game data has this mod as tier 1, "+(13-16) to all Attributes"
#     (mod AllAttributes4); the next tier down is (9-12). The guide's 12 is read as that 13.
#   * "Tier 1 Strength": exactly the Strength the Deafening Essence of Rage adds, "+(51-58) to
#     Strength" (mod StrengthEssence7_).
#   * "Life or Resistances": at least one of Life and the three elemental resistances, each at the
#     top tier the item level (75) allows: Life tier 1, +(100-114); the resistances tier 2, +(42-45)%
#     (their tier 1 needs item level 84). The guide ends with "use the crafting bench on any open
#     modifier", so a crafted Life or Resistance counts too (the group has no not_crafted), and a
#     bench craft counts as tier 1 of what it crafts whatever its range. (The
#     guide calls them prefixes; in the game Life is a prefix and the resistances are suffixes.) To
#     insist on a rolled one, add `not_crafted: true` to the four lines of the last group.
#   * "20 Intrinsic Catalysts" (quality): left out, it is B2. The bench craft of the guide is the
#     crafted Life or Resistance above; a bench craft of no use to the requirements below is not
#     offered by the planner anyway.

# The base item, by its English name exactly as the game writes it (capital letters matter).
# The guide says only "rare ring"; every plain ring has the same pool of mods, so one is picked.
base: Amethyst Ring

# The item level of the ring, a whole number from 1 to 100. The guide says "75+".
item_level: 75

# Influences on the base (shaper, elder, crusader, hunter, redeemer, warlord).
# [] means none.
influence: []

# Everything below must be present on the finished item (a list: every entry is required).
requirements:
  # The fractured All Attributes, tier 1 (13-16). The fractured mod of the start item counts.
  - family: AllAttributes
    min_tier: 1
    not_crafted: true

  # The Strength of the essence (see the readings above), exactly that tier. The bench Strength (up
  # to 30) and the bench "Strength and X" mods are other mods and do not count.
  - family: Strength
    mod: StrengthEssence7_

  # "At least 1 of these 4": Life, or one of the three elemental resistances, each at the top tier
  # the item level allows.
  - at_least: 1
    of:
      - family: IncreasedLife
        min_tier: 1
      - family: FireResistance
        min_tier: 2
      - family: ColdResistance
        min_tier: 2
      - family: LightningResistance
        min_tier: 2

# Where the crafting starts: R05's ring (a fractured All Attributes) bought with 60 Memory Strands.
# `memory_strands` is the key of ADR-0040 and of the amendment of ADR-0008; the target loader does not read
# it until B5-1 (#274). A target never asks for strands; only the start item holds them.
start_item:
  rarity: rare
  memory_strands: 60
  mods:
    - mod: AllAttributes4
      tier: 1
      values: [14]
      fractured: true

# The name of the buy spec docs/research/2026-11-01-strand-routes-files/buy/s12-start-ring.yaml, which is what the stranded ring costs.
start_price: S12 start ring
