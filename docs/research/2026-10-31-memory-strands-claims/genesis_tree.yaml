# Draft claims of research ticket #98 (family genesis_tree). See memory_strands.yaml for how they are checked.
# patch_verified in this file: the last patch whose notes were read for the mechanic, not the pinned 3.29.3.3.
# Wiki and datamined claims say 3.29.1 (the wiki version pages for 3.29.2 and later did not load on 2026-10-31); claims
# from the Reddit post and its sheet say 3.29.0 (the post is dated 2026-09-26/27). Sources were read on 2026-10-31.
rules:
  - id: genesis_tree.equipment_womb_item
    statement: >-
      A Provisioning Wombgift grown in the equipment womb births rare armour or jewellery (jewels and fractured
      items by node choice); the item's base item level is the Wombgift's own level. The passives are free to
      respec; the equipment womb has at most 16 passive points in 3.29.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/The_Genesis_Tree
    quote: "Rare equipment generated through the Genesis Tree have a base item level equal to the wombgift's specified level."
    patch_verified: "3.29.1"
    date_checked: 2026-10-31

  - id: genesis_tree.equipment_tier_rating
    statement: >-
      Three equipment-womb passives (ids EquipmentNode2, EquipmentNode3b, EquipmentNode20a) each give +20
      Modifier Tier Rating to the birthed item (so +60 at most), on top of an inherent rating that GGG lowered
      in 3.28.0 and 3.29.0 and has not published. How the rating cuts tiers at birth (the Necropolis share
      x / (100 + x), rounding, weights of the kept tiers) is NOT claimed here: it is open point 1 of the note.
    source_kind: datamined
    url: https://poedb.tw/us/Modifier_Tier_Rating
    quote: "Birthed Equipment has +20 to Modifier Tier Rating"
    patch_verified: "3.29.1"
    date_checked: 2026-10-31

  - id: genesis_tree.equipment_mod_type_weights
    statement: >-
      The equipment womb's notable passives give "300% increased chance" (weight x4) for one of 14 mod types
      (Physical, Fire, Cold, Lightning, Chaos, Life, Mana, Defences, Attributes, Resistance, Attack, Caster,
      Critical, Speed). The multiplier reading of "increased" (weight x4) is the usual one, not stated by a
      source. The "60% reduced chance" notables are the next claim. Craft of Exile's Genesis table (1000 and
      400, tier values 20/25/40/50) is older than 3.29.0 and loses.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/The_Genesis_Tree
    quote: "Equipment Genesis Tree Notable Passives that grant increased chance for Modifiers of a specific type now have values of 300% (previously 500%)."
    patch_verified: "3.29.1"
    date_checked: 2026-10-31

  - id: genesis_tree.equipment_mod_type_reduced
    statement: >-
      The equipment womb also has "60% reduced chance" notables for the same 14 mod types (weight x0.4 on the
      usual reading, not stated by a source). The wiki table still shows the pre-3.29 values for some nodes, so
      this half is read from the datamined passive texts of PoEDB.
    source_kind: datamined
    url: https://poedb.tw/us/The_Genesis_Tree
    quote: "Birthed Equipment has 60% reduced chance for Physical Modifiers"
    patch_verified: "3.29.1"
    date_checked: 2026-10-31
