# Draft claims for src/crafting_system/rules/claims/unveil.yaml (research ticket #87, note 2026-10-31-veiled-unveiling.md). Patch 3.29.3.3, checked 2026-10-31.
rules:
  - id: unveil.three_options_player_picks
    statement: Unveiling shows three random mods and the player picks one; the picked mod is not a crafted mod.
    source_kind: wiki
    url: https://www.poewiki.net/wiki/Veiled_modifier
    quote: "Unveiling the mod presents three random mods, and allows the player to choose which one the veiled mod becomes."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: unveil.is_free_and_in_place
    statement: Unveiling costs nothing and needs no NPC; it is a right-click on the veiled item.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3787013
    quote: "You are no longer required to speak with Jun to Unveil your items. You can now Right-click (or use Circle/B on Controller) on a Veiled item and simply select the Modifier you wish to Unveil."
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: unveil.offer_pool_is_the_unveiled_domain_by_side
    statement: The offer of a veiled mod is drawn from the mods of the unveiled domain whose generation type is the side of the veiled mod (the generic pool holds 150 mods, 78 prefix and 72 suffix, with a weight above 0 on at least one base). The weight of a mod on a base is that of the first spawn_weights entry whose tag the base has; 0 excludes it. Craft of Exile's veiled pool (id_mgroup 10, vex 0) has the same mod count and total weight on 24 bases compared.
    source_kind: datamined
    url: https://repoe-fork.github.io/mods.json
    quote: 'JunMasterVeiledMovementVelocityAndOnslaughtOnKill: domain "unveiled", generation_type "prefix", groups ["MovementVelocity"], required_level 60, spawn_weights [{"tag": "boots", "weight": 1500}, {"tag": "default", "weight": 0}]'
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: unveil.offer_draw_three_families_no_repeat
    statement: The offer is up to three draws by weight without replacement; after each pick every mod of the picked mod's family leaves the pool; the families of the mods on the item (bench crafts included) are out of the pool from the start; fewer than three options when the pool runs dry; PoE 1 has one tier per mod.
    source_kind: coe
    url: https://www.craftofexile.com/packages/package.js
    quote: 'let unveilModsNumber=3;'
    patch_verified: "3.29.0.3"
    date_checked: 2026-10-31

  - id: unveil.offer_agrees_with_an_independent_figure
    statement: With a helmet prefix pool (9 families, weight 12000) and the Zombies/Skeleton family blocked (weight 2000), the offer algorithm gives P(+2 AoE offered) = 0.4375, against the 0.45 of the SKRYAH quiz slide of route R02.
    source_kind: experiment
    url: https://github.com/Rasslabsya4el/crafting-system/blob/main/docs/research/2026-10-30-5-reference-routes.md
    quote: '{"n":6,"action":"Unveil +2 AoE.","repeat_until":"+2 AoE unveil","on_fail":"Repeat veiled stage.","probability":0.45,"probability_source":"SKRYAH slide transcription"}'
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

  - id: unveil.legacy_mods_have_weight_zero
    statement: 51 unveiled-domain mods have weight 0 on every base and are never offered, among them Trigger a Socketed Spell on Using a Skill (R07's target), the Damage over Time Multiplier prefixes, the quiver/flask legacy mods and the Avoid Elemental Ailments and Stun body armour mod.
    source_kind: datamined
    url: https://repoe-fork.github.io/mods.json
    quote: 'JunMasterVeiledTriggerSocketedSpellOnSkillUse_: domain "unveiled", generation_type "suffix", required_level 60, spawn_weights [{"tag": "weapon", "weight": 0}, {"tag": "default", "weight": 0}]'
    patch_verified: "3.29.3.3"
    date_checked: 2026-10-31

