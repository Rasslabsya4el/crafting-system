# Draft claim of research ticket #271 (family affix_pool). Not yet in src/. Check:
# load_registry(Path("docs/research/2026-11-01-strand-sheet-claims")).
rules:
  - id: affix_pool.royale_duplicates_do_not_spawn
    statement: >-
      Approximate. Four mods of the pinned export, MovementVelocity2Royale, IncreasedCastSpeed2Royale,
      IncreasedAttackSpeed2Royale and LocalIncreasedAttackSpeed2Royale____ (Battle Royale copies at required level 4 or 5,
      named "Sprinter's", "of Nimbleness" and "of Ease" twice), have spawn weights on ordinary bases but are not mods the
      game rolls, so a pool and a tier table leave them out. Evidence: on 27,886 mods of the strand sheet the sheet's own
      count of tiers of a mod type (total_tiers) equals ours exactly when they are left out and is one lower for exactly
      the four mod types when they are in (31 of 1,834 mods in the foulborn and misc currency tab); the sheet's Unravelling
      weights for amulets (suffixes 125,250 at item levels 85 and 86) do not contain them; the total of the amulet suffix
      weights at item level 86 in the local copy of Craft of Exile is 125,250, ours is 126,050 with them and 125,250 without.
      Effect: the four mod types have one tier too many and a pool total too high (amulet suffixes by 800, wand suffixes by
      1,500), which changes the cut of ADR-0040 for them and the chance of the Orb of Unravelling.
    source_kind: experiment
    url: https://docs.google.com/spreadsheets/d/1UKTS29e1XghGTQQJBiu7TR3vrancnZxiyN3tBzj30WI/
    quote: "426,52,Foulborn Orb of Augmentation,of Grandmastery,1,4,252.5,0.2836879433,1"
    patch_verified: "3.29.0"
    date_checked: 2026-11-01
    approximate: true
    approximate_reason: "Three sources agree (the sheet's tier counts, the sheet's pool weights, Craft of Exile's totals); no first-party statement."
    value: {excluded_ids: [MovementVelocity2Royale, IncreasedCastSpeed2Royale, IncreasedAttackSpeed2Royale, LocalIncreasedAttackSpeed2Royale____]}
