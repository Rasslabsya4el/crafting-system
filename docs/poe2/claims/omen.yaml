  - id: omen.whittling
    statement: 'Omen of Whittling: the next Chaos Orb removes the modifier of the lowest level (the level requirement of its tier) instead of a random one; fractured modifiers are skipped.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Chaos Orb will remove the lowest level modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.whittling_ties_and_erasure
    statement: Under Omen of Whittling ties of lowest level are broken uniformly at random, and with an Erasure omen also active the pick is limited to that side.
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: if(!(i.fractured||a&&i.type!=a))return i.minlvl<e?(e=i.minlvl,void(t=[s])):void(i.minlvl==e&&t.push(s))
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: Whittling is assumed to pick at random among equally low modifiers, and to respect an Erasure omen's side.
    page_source: Craft of Exile's code only

