  - id: omen.sanctification
    statement: 'Omen of Sanctification: the next Divine Orb on a Rare item Sanctifies it: each modifier value is multiplied by its own random factor from 0.78 to 1.22 (in 0.01 steps, rounded up) of its current value, and the item then cannot be modified. An older figure was 0.8 to 1.2.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Divine Orb used on a [ItemRarity / Rare] item will [Sanctified / Sanctify] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      min_factor: 0.78
      max_factor: 1.22

  - id: omen.sanctify_multiplies_current
