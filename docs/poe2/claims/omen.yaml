# Mechanic family: omen (every Omen in the PoE2 0.5.5.10 data: crafting omens, retired ones and the non-crafting ones).
# PoE2 research of 2026-11-24, docs/poe2/research/currency-and-omens.md (PoE2 0.5.5.10 game data, 0.5.0 patch notes, Craft of Exile beta 0.5.5.5).
rules:
  - id: omen.activation
    statement: An omen is right-clicked to become active in the inventory and is consumed when its trigger fires; several omens can be active at once.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Right click this item in your inventory to set it to be active. This item is consumed when triggered.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.stack_10
    statement: Omens stack to 10 since 0.3.0.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3826682
    quote: Omens can now stack, with a maximum stack size of 10.
    patch_verified: "0.3.0"
    date_checked: 2026-11-24
    value: 10

  - id: omen.incompatible_pairs
    statement: 'These omens cannot be active together (`value`, each list one group): Sinistral/Dextral of the same currency (Alchemy, Coronation, Exaltation, Annulment, Crystallisation, Necromancy, Erasure) and the three lich omens. Craft of Exile also groups three Chaotic waystone omens, which since 0.5.0 may be used together (omen.chaotic_up_to_three).'
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: omenIncompatibilities:[["OmenOnAlchemyMaximumPrefixes","OmenOnAlchemyMaximumSuffixes"],["OmenOnRegalPrefix","OmenOnRegalSuffix"],["OmenOnExaltAddPrefixes","OmenOnExaltAddSuffixes"]
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    value:
      - - Omen of Sinistral Alchemy
        - Omen of Dextral Alchemy
      - - Omen of Sinistral Coronation
        - Omen of Dextral Coronation
      - - Omen of Sinistral Exaltation
        - Omen of Dextral Exaltation
      - - Omen of Sinistral Annulment
        - Omen of Dextral Annulment
      - - Omen of Sinistral Crystallisation
        - Omen of Dextral Crystallisation
      - - Omen of Sinistral Necromancy
        - Omen of Dextral Necromancy
      - - Omen of Sinistral Erasure
        - Omen of Dextral Erasure
      - - Omen of the Sovereign
        - Omen of the Liege
        - Omen of the Blackblooded
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: Two omens of opposite sides for the same currency are assumed not to work together.
    page_source: Craft of Exile's code only

  - id: omen.greater_exaltation
    statement: 'Omen of Greater Exaltation: the next Exalted Orb (any tier, with its minimum level) adds 2 random modifiers instead of 1. What happens with only 1 open affix is not known (Craft of Exile simply rolls 2).'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Exalted Orb will add two random modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: 2

  - id: omen.sinistral_exaltation
    statement: 'Omen of Sinistral Exaltation: the next Exalted Orb adds only a prefix (it needs an open prefix); the pool is limited to prefixes with their weights unchanged.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Exalted Orb will add only prefix modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.dextral_exaltation
    statement: 'Omen of Dextral Exaltation: the next Exalted Orb adds only a suffix (it needs an open suffix); the pool is limited to suffixes with their weights unchanged.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Exalted Orb will add only suffix modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.homogenising_exaltation
    statement: 'Omen of Homogenising Exaltation: the next Exalted Orb adds a modifier of the same type as one already on the item. It no longer drops (0.4.0) and is on the Currency Exchange in Standard only (0.5.0).'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Exalted Orb will add a Modifier of the same type as an existing Modifier on the Item
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.homogenising_tag_rule
    statement: 'Craft of Exile reads the Homogenising omens'' "same type" as: the pool is limited to modifiers sharing at least one modifier tag with an existing explicit modifier (some tags excluded).'
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: addHomogenizationTagsToEffects(e,t){let a=[];return t.forEach((t,i)=>{t.tags.forEach(function(t){let i=DataManager.getEntryFromId(coedata.tags,t);null==i.label||a.includes(i.key)||gameConstants.excludeTagsForHomogenize.includes(i.key)||(a.push(i.key),e.addAllowed(i.id))})}),e}
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: A Homogenising omen is assumed to add a modifier that shares a tag with one already on the item.
    page_source: Craft of Exile's code only

  - id: omen.homogenising_disabled
    statement: The two Homogenising omens stopped dropping in 0.4.0; items already owned still work.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3883495
    quote: Omen of Homogenising Exaltation and the Omen of Homogenising Coronation have been disabled from dropping.
    patch_verified: "0.4.0"
    date_checked: 2026-11-24

  - id: omen.catalysing_exaltation
    statement: 'Omen of Catalysing Exaltation: the next Exalted Orb on a ring, amulet or jewel with catalyst quality consumes all of it (quality becomes 0) to raise the chance of the modifiers of the catalyst''s type.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: While this item is active in your inventory your next Exalted Orb will consume all [Catalyst] [Quality] to increase the chance of the corresponding type of Modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: omen.catalysing_exaltation_weight
    statement: Under Omen of Catalysing Exaltation the weight of modifiers with the catalyst's tag is multiplied by 1 + 0.2*Q for quality Q up to 20 (x5 at 20), and by 1 + 0.2*20 + 0.12*(Q-20) above 20.
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: let e=1,a=gameConstants.maximumDefaultQuality-this._item._quality;a<0?(a=Math.abs(a),e+=.12*a,e+=.2*gameConstants.maximumDefaultQuality):e+=.2*this._item._quality
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    value:
      per_quality_point_to_20: 0.2
      per_quality_point_above_20: 0.12
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: How strongly Catalysing Exaltation favours the catalyst's modifiers is the emulator's estimate.
    page_source: Craft of Exile's code only

