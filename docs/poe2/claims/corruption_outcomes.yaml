# APPROXIMATE (ADR-0028): a claim marked approximate: true rests on one secondary source, an older patch,
# a search snippet or an inference from data; the open checks are in docs/poe2/notes/essences-socketables-corruption-abyss.md.
rules:
  - id: corruption_outcomes.enchantment_pool_by_tag
    statement: 'The corrupted enchantments (corruption implicits) are the 114 modifiers of generation type ''corrupted'' with item spawn
      tags; `value` maps each tag (base tag or class tag; ''jewel'' for the jewel ones) to {mod id: text}. Examples: body armour (10-20)%
      of Damage taken Recouped as Life, amulet +1 to Level of all Skills, bow ''Bow Attacks fire an additional Arrow''. poe2db''s 125 ''Corrupted
      Mods'' add monster and relic ones.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/mods.min.json
    quote: (10-20)% of Damage taken Recouped as Life | body_armour | 1 | CorruptionDamageTakenGainedAsLife1
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
