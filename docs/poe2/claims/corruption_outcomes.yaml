  - id: corruption_outcomes.values_outcome_multiplies
    statement: Since 0.5.0 the corruption outcome that pushed modifier values beyond their range multiplies each modifier on the item instead;
      the multiplier's range for non-unique items is not stated in what was read.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: The Corruption outcome that randomises the numeric values of the modifiers on an item beyond the normal range now multiplies
      each modifier
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    history:
    - held_until: "0.4.0"
      source_kind: wiki
      url: https://maxroll.gg/poe2/resources/corruption-outcomes
      quote: Randomizing up to 3 affixes on a Rare item
      statement: In 0.4 the outcome randomised the values of up to three affixes of a rare item.

  - id: corruption_outcomes.equipment_outcomes
    statement: 'A Vaal Orb on rare or magic equipment gives one of: no change; the modifier values multiplied (corruption_outcomes.values_outcome_multiplies);
      a corrupted enchantment; +1 augment socket beyond the limit on helmets, gloves, boots, body armours, shields, foci and martial weapons;
      quality raised up to 23% on wands and staves. Uniques can also have their values rerolled between 0.78 and 1.22 of the current roll.'
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: Updated for new corruption outcomes from the 0.4 Fate of the Vaal League
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    value:
      rare_magic: [no change, values, enchantment, socket, quality]
      unique_extra: [divine 0.78 to 1.22]
    approximate: true
    approximate_reason: The list is Maxroll's for 0.4; only the values outcome is confirmed changed for 0.5.
    page_statement: A Vaal Orb on gear can do nothing, change its modifier values, add an enchantment, add a socket or raise quality on
      caster weapons.
    page_source: a Maxroll guide for the previous patch

  - id: corruption_outcomes.extra_socket_classes
    statement: The +1 socket outcome ignores the socket limit and exists for helmets, gloves, boots, body armours, shields, foci and martial
      weapons; caster weapons, amulets, belts and rings cannot get it.
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: +1 Socket (ignoring limit)
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    value: [Helmet, Gloves, Boots, Body Armour, Shield, Focus, Martial Weapon]
    approximate: true
    approximate_reason: Maxroll's 0.4 list, not re-checked for 0.5.
    page_statement: Corruption can add a socket past the limit on armour pieces, shields, foci and martial weapons.
    page_source: a Maxroll guide for the previous patch

  - id: corruption_outcomes.jewel_outcomes
    statement: 'On a magic or rare jewel a Vaal Orb gives no change, randomised values on 1 to 3 affixes, a corrupted enchantment, or adds
      or removes an affix ignoring the normal limits. On a unique jewel: no change (50%), an enchantment, or values multiplied between 0.78
      and 1.22.'
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: No change (50%)
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Maxroll's 0.4 list, not re-checked for 0.5.
    page_statement: Corrupting a jewel can add or remove a modifier beyond the normal limits, add an enchantment or change values.
    page_source: a Maxroll guide for the previous patch

  - id: corruption_outcomes.waystone_gem_flask_outcomes
    statement: 'Waystones: no change, +1 or -1 tier (min 1, max 16), all affixes turned into prefixes or into suffixes, random affixes added
      to a rare waystone. Skill gems: no change, +/-1 level, +/-1 support socket, -7% to +3% quality. Flasks and charms: quality changed
      up to 23%.'
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: +1 Tier/-1 Tier (Min 1, max 16)
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Maxroll's 0.4 list, not re-checked for 0.5.
    page_statement: Corrupting a waystone, gem or flask changes its tier, level or quality, or does nothing.
    page_source: a Maxroll guide for the previous patch

  - id: corruption_outcomes.equal_chances
    statement: 'UNVERIFIED: the outcomes of a Vaal Orb are taken to be equally likely (Maxroll: ''all equally likely''; another site says
      25% each for gems and uniques; unique jewels: no change 50%). No official numbers exist.'
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: all equally likely
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: No official probabilities; secondary sources for 0.4 disagree in detail.
    page_statement: Each possible result of a Vaal Orb is taken to be equally likely.
    page_source: game guides for the previous patch
