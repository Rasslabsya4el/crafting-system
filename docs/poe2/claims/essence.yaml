  - id: essence.corrupting_essence_monsters
    statement: A Vaal Orb used on an imprisoned essence monster can change the number of essences, reroll them all to one type, or upgrade
      them (to Greater, then to Essence of Hysteria, Delirium, Horror or Insanity). This is how the corrupted essences are made; no bench
      recipe makes them. 0.5.0 fixed a bug where corrupting essences could remove an essence.
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: Change the number of Essences; reroll all to the same type; or upgrade Essences to Greater, then Corrupted (Hysteria, Delirium,
      Horror, Insanity)
    patch_verified: "0.4.0"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Maxroll's page is written for 0.4 and the quote is a summary read through a model, not verbatim.
    page_statement: Corrupting an essence monster with a Vaal Orb can upgrade its essences, up to the corrupted ones.
    page_source: a Maxroll guide written for the previous patch
