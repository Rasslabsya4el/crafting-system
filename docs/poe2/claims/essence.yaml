# Mechanic family: essence (the 82 essences: Magic to Rare with a guaranteed mod, and the Perfect and special ones that swap one mod of a Rare).
# PoE2 research of 2026-11-24, docs/poe2/research/essences-socketables-corruption-abyss.md
# (PoE2 0.5.5.10; game data pin research/poe2/data/PIN.json, derived tables under research/poe2/data/derived/).
# APPROXIMATE (ADR-0028): a claim marked approximate: true rests on one secondary source, an older patch,
# a search snippet or an inference from data; the open checks are in docs/poe2/notes/essences-socketables-corruption-abyss.md.
rules:
  - id: essence.lower_tiers_turn_magic_into_rare
    statement: 'A Lesser, normal or Greater essence (the 57 of the first three tiers: Lesser Essence of X, Essence of X, Greater Essence
      of X) is used on a Magic item and makes it Rare, adding the essence''s guaranteed modifier.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Upgrades a [ItemRarity / Magic] item to a [ItemRarity / Rare] item, adding a guaranteed modifier | Right click this item then
      left click a Magic item to apply it.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      tiers: [Lesser, normal, Greater]
      takes: Magic
      gives: Rare

  - id: essence.perfect_and_special_reroll_one_mod_of_a_rare
    statement: 'A Perfect essence and each of the six special essences (Essence of Hysteria, Essence of Delirium, Essence of Horror, Essence
      of Insanity, Essence of the Abyss, Essence of the Breach) is used on a Rare item: it removes one random modifier and adds the essence''s
      guaranteed modifier.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Removes a random modifier and augments a [ItemRarity / Rare] item with a new guaranteed modifier | Right click this item then
      left click a Rare item to apply it.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {takes: Rare, removes: 1, adds: 1}

  - id: essence.no_tier_crosses_rarity
    statement: No Lesser, normal or Greater essence can be used on a Rare item, and no Perfect or special essence on a Magic item; none
      of them is used on a Normal item (each one's directions name a single rarity).
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Right click this item then left click a Magic item to apply it.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {Lesser: Magic, normal: Magic, Greater: Magic, Perfect: Rare, special: Rare}

  - id: essence.magic_to_rare_keeps_existing_mods
    statement: 'APPROXIMATE: a Lesser, normal or Greater essence on a Magic item keeps the item''s one or two magic modifiers and adds only
      the essence''s modifier (no random modifiers are added). No page read on 2026-11-24 says it in words; it is the established PoE2 behaviour
      and matches the item text ''Upgrades ... adding a guaranteed modifier''.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Upgrades a [ItemRarity / Magic] item to a [ItemRarity / Rare] item, adding a guaranteed modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: No source states what happens to the magic mods; inferred from the item text and common knowledge; the case of a
      full affix side is unknown.
    page_statement: An essence on a magic item is taken to keep its magic modifiers and add only the essence's modifier.
    page_source: the game's item text and common player knowledge, not checked in game

  - id: essence.families_and_tiers
    statement: 'There are 19 essence families, each in four tiers (Lesser, normal, Greater, Perfect): 76 essences, plus 6 special essences
      (Hysteria, Delirium, Horror, Insanity, the Abyss, the Breach), 82 in all. The trade site''s static list of 2026-11-24 holds the same
      82 names (the 84 counted earlier is not borne out).'
    source_kind: datamined
    url: https://poe2db.tw/us/Essence
    quote: Essence /95
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      families: [the Body, the Mind, Enhancement, Abrasion, Flames, Ice, Electricity, Ruin, Battle, Sorcery, Haste, the Infinite, Seeking,
        Insulation, Thawing, Grounding, Alacrity, Opulence, Command]
      Lesser: [Lesser Essence of the Body, Lesser Essence of the Mind, Lesser Essence of Enhancement, Lesser Essence of Abrasion, Lesser
          Essence of Flames, Lesser Essence of Ice, Lesser Essence of Electricity, Lesser Essence of Ruin, Lesser Essence of Battle, Lesser
          Essence of Sorcery, Lesser Essence of Haste, Lesser Essence of the Infinite, Lesser Essence of Seeking, Lesser Essence of Insulation,
        Lesser Essence of Thawing, Lesser Essence of Grounding, Lesser Essence of Alacrity, Lesser Essence of Opulence, Lesser Essence of
          Command]
      normal: [Essence of the Body, Essence of the Mind, Essence of Enhancement, Essence of Abrasion, Essence of Flames, Essence of Ice,
        Essence of Electricity, Essence of Ruin, Essence of Battle, Essence of Sorcery, Essence of Haste, Essence of the Infinite, Essence
          of Seeking, Essence of Insulation, Essence of Thawing, Essence of Grounding, Essence of Alacrity, Essence of Opulence, Essence
          of Command]
      Greater: [Greater Essence of the Body, Greater Essence of the Mind, Greater Essence of Enhancement, Greater Essence of Abrasion, Greater
          Essence of Flames, Greater Essence of Ice, Greater Essence of Electricity, Greater Essence of Ruin, Greater Essence of Battle,
        Greater Essence of Sorcery, Greater Essence of Haste, Greater Essence of the Infinite, Greater Essence of Seeking, Greater Essence
          of Insulation, Greater Essence of Thawing, Greater Essence of Grounding, Greater Essence of Alacrity, Greater Essence of Opulence,
        Greater Essence of Command]
      Perfect: [Perfect Essence of the Body, Perfect Essence of the Mind, Perfect Essence of Enhancement, Perfect Essence of Abrasion, Perfect
          Essence of Flames, Perfect Essence of Ice, Perfect Essence of Electricity, Perfect Essence of Ruin, Perfect Essence of Battle,
        Perfect Essence of Sorcery, Perfect Essence of Haste, Perfect Essence of the Infinite, Perfect Essence of Seeking, Perfect Essence
          of Insulation, Perfect Essence of Thawing, Perfect Essence of Grounding, Perfect Essence of Alacrity, Perfect Essence of Opulence,
        Perfect Essence of Command]
      special: [Essence of Hysteria, Essence of Delirium, Essence of Horror, Essence of Insanity, Essence of the Abyss, Essence of the Breach]

  - id: essence.tier_column
    statement: 'The game''s Essences table puts the essences in three groups by its tier column: 0 = the Lesser, normal and Greater essences
      (Magic to Rare); 1 = the Perfect essences, Essence of the Abyss, Essence of the Breach and the 13 Expedition alloys; 2 = Essence of
      Hysteria, Essence of Delirium, Essence of Horror, Essence of Insanity. The meaning of the column is read from which essences carry
      each value.'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/Essences.csv
    quote: Essence of Hysteria | 2 |  | Amulet | DamageTakenGainedAsLife4_
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {0: 'Lesser, normal, Greater', 1: 'Perfect, the Abyss, the Breach, alloys', 2: 'Hysteria, Delirium, Horror, Insanity'}
    approximate: true
    approximate_reason: The column is unnamed in meaning; read from its values.
    page_statement: The game groups Hysteria, Delirium, Horror and Insanity apart from the Abyss and Breach essences, which sit with the
      Perfect ones.
    page_source: the game's data files, our reading of them

