  - id: essence.guaranteed_mod_from_a_list
    statement: 'Five essences give one modifier out of a list instead of one fixed modifier: Lesser Essence of Enhancement, Essence of Enhancement
      and Greater Essence of Enhancement (one per armour defence type), Lesser Essence of the Infinite, Essence of the Infinite, Greater
      Essence of the Infinite and Perfect Essence of the Infinite (Strength, Dexterity or Intelligence), Greater Essence of Battle (local
      or global accuracy), and Essence of the Abyss (the Mark as a prefix or a suffix). Weights are in the data only for Perfect Essence
      of the Infinite (50, 50, 50) and Essence of the Abyss (50, 50). APPROXIMATE: which mod the others give is taken to be the one that
      fits the base (its defence type, local versus global) and, where several fit, an even draw.'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/EssenceMods.csv
    quote: Essence of the Abyss | 1 |  | AllEquipment |  | EssenceAbyssPrefix, EssenceAbyssSuffix | [50,50]
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Essence of Enhancement:
        Armour:
          mods: [LocalIncreasedPhysicalDamageReductionRatingPercent4, LocalIncreasedEvasionRatingPercent4, LocalIncreasedEnergyShieldPercent4,
            LocalIncreasedArmourAndEvasion4, LocalIncreasedArmourAndEnergyShield4, LocalIncreasedEvasionAndEnergyShield4]
          weights: '[]'
      Essence of the Abyss:
        AllEquipment:
          mods: [EssenceAbyssPrefix, EssenceAbyssSuffix]
          weights: '[50,50]'
      Essence of the Infinite:
        AllEquipment:
          mods: [Strength4, Dexterity4, Intelligence4]
          weights: '[]'
      Greater Essence of Battle:
        GlovesQuiver:
          mods: [LocalIncreasedAccuracy7, IncreasedAccuracy7]
          weights: '[]'
      Greater Essence of Enhancement:
        Armour:
          mods: [LocalIncreasedPhysicalDamageReductionRatingPercent5, LocalIncreasedEvasionRatingPercent5, LocalIncreasedEnergyShieldPercent5,
            LocalIncreasedArmourAndEvasion5, LocalIncreasedArmourAndEnergyShield5, LocalIncreasedEvasionAndEnergyShield5_]
          weights: '[]'
      Greater Essence of the Infinite:
        AllEquipment:
          mods: [Strength6, Dexterity6, Intelligence6]
          weights: '[]'
      Lesser Essence of Enhancement:
        Armour:
          mods: [LocalIncreasedPhysicalDamageReductionRatingPercent2, LocalIncreasedEvasionRatingPercent2, LocalIncreasedEnergyShieldPercent2,
            LocalIncreasedArmourAndEvasion2, LocalIncreasedArmourAndEnergyShield2, LocalIncreasedEvasionAndEnergyShield2]
          weights: '[]'
      Lesser Essence of the Infinite:
        AllEquipment:
          mods: [Strength2, Dexterity2, Intelligence2]
          weights: '[]'
      Perfect Essence of the Infinite:
        Amulet:
          mods: [EssencePercentStrength1, EssencePercentDexterity1, EssencePercentIntelligence1]
          weights: '[50,50,50]'
    approximate: true
    approximate_reason: The data lists the outcome mods; the rule choosing among them is not stated for lists without weights.
    page_statement: Essences of Enhancement and of the Infinite give the defence or attribute modifier that fits the item, chosen evenly
      when several fit.
    page_source: the game's data files and our reading of them

