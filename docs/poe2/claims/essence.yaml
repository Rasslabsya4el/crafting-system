  - id: essence.poe2db_required_level_is_four_fifths
    statement: 'The ''Required Level'' poe2db prints for an essence modifier is the character level the modifier asks, about four fifths
      of the modifier level in the data (Greater Essence of the Body on a helmet: 43 printed, level 54; Perfect essences: 57 printed, level
      72; Essence of Hysteria on a helmet: 4 printed, level 5). It is not the modifier level.'
    source_kind: datamined
    url: https://poe2db.tw/us/Greater_Essence_of_the_Body
    quote: +(100—119) to maximum Life | Prefix | 43
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Read by comparing poe2db's numbers with the data's modifier levels; the four-fifths ratio is inferred.
    page_statement: The level poe2db shows beside an essence's modifier is the character level it asks, not the item level it needs.
    page_source: poe2db compared with the game's data files

  - id: essence.item_level_does_not_gate
    statement: 'UNVERIFIED: an essence is taken to apply to an item whatever its item level, even below the level of the essence''s modifier
      (Greater Essence of the Body, level 54, on an item level 30 helmet). No source states it either way; the essence''s text names no
      item level.'
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Upgrades a [ItemRarity / Magic] item to a [ItemRarity / Rare] item, adding a guaranteed modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: No source says whether item level limits an essence; the default follows the item text, which names no limit.
    page_statement: An essence is taken to work on an item of any item level; this is not checked in game.
    page_source: the game's item text only

  - id: essence.perfect_tier_changes_class_and_mod
    statement: 'A Perfect essence gives a different modifier, on fewer item classes, than the lower tiers of its family: Perfect Essence
      of the Body (8-10)% increased maximum Life on Body Armour only; Perfect Essence of the Mind (4-6)% increased maximum Mana on Rings;
      Perfect Essence of Battle +2 to Level of all Attack Skills on one-hand weapons and bows, +3 on two-hand weapons and crossbows; Perfect
      Essence of Sorcery +3 (Wand) or +5 (Staff) to spell skills; Perfect Essence of Insulation, Thawing and Grounding (26-30)% of Fire,
      Cold or Lightning damage taken recouped as Life on Belt, Helmet or Gloves. The full map is essence.guaranteed_mod_by_category.'
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: The Perfect Essence of Battle now provides +3 to Level of all Attack Skills on Two Hand Melee Weapons or Crossbows
    patch_verified: "0.5.0"
    date_checked: 2026-11-24

  - id: essence.tiers_do_not_share_classes
    statement: 'The tiers of one family do not always cover the same classes: Essence of the Body gives +(70-84) life on Amulet, Boots,
      Gloves and Ring, while Greater Essence of the Body gives +(85-99) on Amulet, Boots and Gloves only (its ring row is gone) and +(100-119)
      on Belt, Body Armour, Helmet and Shield.'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/EssenceMods.csv
    quote: 'Greater Essence of the Body | 0 |  | AmuletBootsGloves | IncreasedLife7: +(85-99) to maximum Life (level 46, prefix)'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: essence.removed_mod_is_random
    statement: A Perfect or special essence removes a random modifier of the item before adding its own; without an omen any modifier can
      be the one removed. The Crystallisation omens that restrict the side are socketable_rules.crystallisation_omens.
    source_kind: datamined
    url: https://poe2db.tw/us/Essence
    quote: Removes a random modifier and augments a Rare item with a new guaranteed modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: essence.removal_skips_fractured
    statement: 'UNVERIFIED: the random removal of a Perfect or special essence never removes a fractured modifier, by the usual rule that
      fractured modifiers cannot be removed; no page read states it for essences.'
    source_kind: datamined
    url: https://poe2db.tw/us/Essence
    quote: Removes a random modifier and augments a Rare item with a new guaranteed modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: The general fractured rule is assumed; no source names essences.
    page_statement: A Perfect essence is taken never to remove a fractured modifier.
    page_source: the general rule for fractured modifiers, not checked for essences

  - id: essence.hysteria_mods
    statement: 'Essence of Hysteria gives: Helmet +1 to Level of all Minion Skills; Body Armour (64-97) to (98-145) Physical Thorns damage;
      Gloves (25-29)% increased Critical Damage Bonus; Boots 30% increased Movement Speed; Ring (50-59)% increased Mana Regeneration Rate;
      Amulet (19-21)% of Damage taken Recouped as Life; Belt +(254-304) to Stun Threshold; Shield and Buckler (20-24)% increased Block chance;
      Quiver (43-50)% increased Damage with Bow Skills; Focus (20-23)% increased Energy Shield Recharge Rate (the focus line since 0.5.0).'
    source_kind: official
