# Mechanic family: quality (maximum quality, what a quality point gives, how quality goes over the maximum).
# PoE2 research of 2026-11-24, docs/poe2/research/items-and-modifiers.md (facts 24, 25).
# The catalyst items themselves belong to the catalyst family another file holds; the rule here is
# only what quality does on each class.
rules:
  - id: quality.default_maximum_and_effects
    statement: Quality goes up to a default maximum of 20%. Per quality point martial weapons get 1% more physical damage, armour 1% more armour, evasion, energy shield and runic ward, flasks 1% more life and mana recovery, charms 1% increased duration; rings and amulets take quality types that raise specific modifiers.
    source_kind: datamined
    url: https://poe2db.tw/us/Quality
    quote: "Quality grants small bonuses to an item depending on the type of item, up to a default maximum of 20%. Martial Weapons gain 1% more Physical damage per Quality. Armours gain 1% more Armour , Evasion , Energy Shield and Runic Ward per Quality."
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {default_max: 20}

  - id: quality.jewellery_quality_replaces_other_types
    statement: Rings and amulets (and, since 0.5.0, jewels) take quality only from catalysts, each of which raises one modifier group and replaces any other quality type on the item.
    source_kind: datamined
    url: https://poe2db.tw/us/Quality
    quote: "Adds quality that enhances Life modifiers on a ring or amulet Replaces other quality types"
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: quality.jewel_catalysts_added
    statement: Since 0.5.0 twelve catalysts can add quality modifiers to jewels, and catalysts come only from the Genesis Tree.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: "Added a new set of 12 Catalysts that can add new quality modifiers to Jewels."
    patch_verified: "0.5.0"
    date_checked: 2026-11-24

  - id: quality.vaal_infuser_over_maximum
    statement: A Vaal infuser raises quality above the maximum by up to 10% (to 30% from the default 20%), with a chance to corrupt the item; since 0.5.0 every infuser needs the item at or above 20% quality first.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: "All Infusers can only be used on items at or above 20% Quality."
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value: {over_max: 10, needs_quality_at_least: 20}

  - id: quality.infuser_item_text
    statement: The Vaal Armourer's Infuser text states the over-maximum rule and the corruption risk.
    source_kind: datamined
    url: https://poe2db.tw/us/Quality
    quote: "Vaal Armourer's Infuser Stack Size: 1 / 10 Improves the quality of an Armour , exceeding maximum quality by up to 10% with a chance of Corrupting it"
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: quality.essence_of_the_breach_raises_maximum
    statement: The Essence of the Breach on jewellery adds +20% to maximum quality.
    source_kind: datamined
    url: https://poe2db.tw/us/Essence
    quote: "Lord Essence of the Breach Stack Size: 1 / 10 Removes a random modifier and augments a Rare item with a new guaranteed modifier Jewellery : +20 % to Maximum Quality"
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
