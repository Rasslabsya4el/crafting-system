      Thane Grannell''s, Countess Seske''s, Thane Girt''s, Thane Myrk''s, Lady Hestra''s, Thane Leld''s and The Greatwolf''s runes) by slot
      category (`value`: rune -> {category: stats}).'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/SoulCoreStats.csv
    quote: 'Lady Hestra''s Rune of Winter | RuneSpecial22 | 50 | 0 | 1 | 1 | 1 | 1 | Martial Weapon: minimum_added_cold_damage_vs_chilled_enemies=19,
      maximum_added_cold_damage_vs_chilled_enemies=28'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Hedgewitch Assandra's Rune of Wisdom: {Wand or Staff: spell_skill_gem_level_+=1}
      Saqawal's Rune of the Sky: {Martial Weapon: non_skill_base_all_damage_%_to_gain_as_cold_fire_lightning=5, Wand or Staff: non_skill_base_all_damage_%_to_gain_as_cold_fire_lightning=5}
      Fenumus' Rune of Agony: {Martial Weapon: non_skill_base_all_damage_%_to_gain_as_chaos=13, Wand or Staff: non_skill_base_all_damage_%_to_gain_as_chaos=13}
