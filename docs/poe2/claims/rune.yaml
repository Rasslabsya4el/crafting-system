# Mechanic family: rune (the runes: tiered families, named, ancient, warding and legacy runes, and their effect per slot).
# PoE2 research of 2026-11-24, docs/poe2/research/essences-socketables-corruption-abyss.md
# (PoE2 0.5.5.10; game data pin research/poe2/data/PIN.json, derived tables under research/poe2/data/derived/).
# APPROXIMATE (ADR-0028): a claim marked approximate: true rests on one secondary source, an older patch,
# a search snippet or an inference from data; the open checks are in docs/poe2/notes/essences-socketables-corruption-abyss.md.
rules:
  - id: rune.tiered_families
    statement: 'The tiered runes come in 16 families: Desert, Glacial, Storm, Iron, Body, Mind, Rebirth, Inspiration, Stone, Vision, Robust,
      Adept, Resolve, Ward and Charging each as Lesser, normal, Greater and Perfect, and Tempered as Lesser, normal and Greater only (no
      Perfect Tempered Rune exists in the data). `value` lists each family''s runes.'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/SoulCoreStats.csv
    quote: 'Lesser Tempered Rune | RunePhysicalLesser | 0 | 0 | 1 | 1 | 1 | 1 | Martial Weapon: local_minimum_added_physical_damage=3'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Desert: [Lesser Desert Rune, Desert Rune, Greater Desert Rune, Perfect Desert Rune]
      Glacial: [Lesser Glacial Rune, Glacial Rune, Greater Glacial Rune, Perfect Glacial Rune]
      Storm: [Lesser Storm Rune, Storm Rune, Greater Storm Rune, Perfect Storm Rune]
      Iron: [Lesser Iron Rune, Iron Rune, Greater Iron Rune, Perfect Iron Rune]
      Body: [Lesser Body Rune, Body Rune, Greater Body Rune, Perfect Body Rune]
      Mind: [Lesser Mind Rune, Mind Rune, Greater Mind Rune, Perfect Mind Rune]
      Rebirth: [Lesser Rebirth Rune, Rebirth Rune, Greater Rebirth Rune, Perfect Rebirth Rune]
      Inspiration: [Lesser Inspiration Rune, Inspiration Rune, Greater Inspiration Rune, Perfect Inspiration Rune]
      Stone: [Lesser Stone Rune, Stone Rune, Greater Stone Rune, Perfect Stone Rune]
      Vision: [Lesser Vision Rune, Vision Rune, Greater Vision Rune, Perfect Vision Rune]
      Robust: [Lesser Robust Rune, Robust Rune, Greater Robust Rune, Perfect Robust Rune]
      Adept: [Lesser Adept Rune, Adept Rune, Greater Adept Rune, Perfect Adept Rune]
      Resolve: [Lesser Resolve Rune, Resolve Rune, Greater Resolve Rune, Perfect Resolve Rune]
      Tempered: [Lesser Tempered Rune, Tempered Rune, Greater Tempered Rune]
      Ward: [Lesser Ward Rune, Ward Rune, Greater Ward Rune, Perfect Ward Rune]
      Charging: [Lesser Charging Rune, Charging Rune, Greater Charging Rune, Perfect Charging Rune]

  - id: rune.generic_rune_slots
    statement: A generic tiered rune has one effect for a Martial Weapon, one for a Wand or Staff, and one for Armour, and fits any of them;
      the effect is the one of the slot it is socketed in. Named runes, idols and soul cores mostly fit one or two slot types only.
    source_kind: datamined
    url: https://poe2db.tw/us/Rune
    quote: 'Martial Weapon: Adds 7 to 11 Fire Damage ; Wand or Staff: Gain 8% of Damage as Extra Fire Damage ; Armour: +14% to Fire Resistance'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

