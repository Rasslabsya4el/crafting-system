# Mechanic family: mirror (Mirror of Kalandra).
# PoE2 research of 2026-11-24, docs/poe2/research/currency-and-omens.md (PoE2 0.5.5.10 game data, 0.5.0 patch notes, Craft of Exile beta 0.5.5.5).
rules:
  - id: mirror.creates_mirrored_copy
    statement: A Mirror of Kalandra creates a Mirrored copy of an equippable non-unique item; the copy cannot be modified.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Right click this item then left click an equipable non-unique item to apply it. Mirrored copies cannot be modified.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: mirror.cost
    statement: One use of Mirror of Kalandra consumes one Mirror of Kalandra; the value maps its price name (the item's name in the game data) to the number of items.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: 'Metadata/Items/Currency/CurrencyDuplicate: Mirror of Kalandra'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Mirror of Kalandra: 1
