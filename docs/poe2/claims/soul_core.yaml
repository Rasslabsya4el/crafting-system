  - id: soul_core.atziri_corruption_always_changes
    statement: 'The four Atziri''s Soul Cores (Devotion on Helmets, Vitality on Body Armours, Alacrity on Gloves, Inoculation on Boots)
      are socket-bound, give a bonus per corrupted item equipped, and carry ''Corrupting will always result in change'': a Vaal Orb on the
      item holding one never gives the ''no change'' outcome (stat soul_core_cannot_roll_no_outcome_with_corruption).'
    source_kind: datamined
    url: https://raw.githubusercontent.com/repoe-fork/dat-export/85174b650e4ed46d672745e280f5a0e5827cad80/current/poe2/heuristics/csv/SoulCoreStats.csv
    quote: 'Atziri''s Soul Core of Devotion | SoulCoreSpecial29 | 50 | 1 |  | 1 | 1 | 1 | Helmet: soul_core_cannot_roll_no_outcome_with_corruption=1,
      spirit_+%_per_equipped_corrupted_item=1'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {Atziri's Soul Core of Devotion: Helmet, Atziri's Soul Core of Vitality: Body Armour, Atziri's Soul Core of Alacrity: Gloves,
      Atziri's Soul Core of Inoculation: Boots}

  - id: soul_core.vaal_theses
    statement: 'The four Vaal Theses (Guatelitzi''s Thesis, Citaqualotl''s Thesis, Jiquani''s Thesis, Quipolatl''s Thesis) are soul-core
      class Ancient Augments, Requires Level 60, one Ancient Augment socketed at a time. `value`: thesis -> {category: stats}.'
    source_kind: datamined
    url: https://poe2db.tw/us/Augment
    quote: 'Guatelitzi''s Thesis | Limited to: 1 Ancient Augment ; Requires: Level 60'
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Guatelitzi's Thesis: {Helmet: gain_armour_from_%_life_loss_from_hits_lasting_8_seconds=35, Body Armour: physical_damage_prevented_recouped_as_life_%=10,
        Boots: 'life_loss_%_per_minute_while_sprinting=300, sprint_movement_speed_+%=25'}
      Citaqualotl's Thesis: {Body Armour: recoup_life_equal_to_%_of_hit_damage_dealt_to_your_offerings=50, Gloves: revive_random_persistent_minion_on_offering_expiration=1,
        Boots: sacrifice_%_life_to_gain_as_guard_on_dodge_roll=10}
      Jiquani's Thesis: {Helmet: gain_X_max_mana_per_3_armour_on_equipped_helmet=1, Gloves: energy_shield_recharge_starts_after_spending_2000_mana_every_2_seconds=1,
        Boots: increases_and_reductions_to_move_speed_apply_to_es_recharge_rate=1}
      Quipolatl's Thesis: {Helmet: mark_grants_%_max_glory_to_random_skill_on_activate=50, Gloves: energy_shield_recharge_start_when_minions_reform=1,
        Body Armour: armour_%_also_applies_to_chaos_damage_while_at_full_es=75}

