# Mechanic family: distilled_emotion (Liquid Emotions: instilling amulets, waystone lines and the 0.5 jewel craft).
# PoE2 research of 2026-11-24, docs/poe2/research/essences-socketables-corruption-abyss.md
# (PoE2 0.5.5.10; game data pin research/poe2/data/PIN.json, derived tables under research/poe2/data/derived/).
# APPROXIMATE (ADR-0028): a claim marked approximate: true rests on one secondary source, an older patch,
# a search snippet or an inference from data; the open checks are in docs/poe2/notes/essences-socketables-corruption-abyss.md.
rules:
  - id: distilled_emotion.names_and_tiers
    statement: Liquid Emotions (formerly Distilled Emotions; Delirium drops) come as 10 core emotions in tier order (Diluted Liquid Ire,
      Diluted Liquid Guilt, Diluted Liquid Greed, Liquid Paranoia, Liquid Envy, Liquid Disgust, Liquid Despair, Concentrated Liquid Fear,
      Concentrated Liquid Suffering, Concentrated Liquid Isolation), 3 Potent ones (Potent Liquid Melancholy, Potent Liquid Ferocity, Potent
      Liquid Contempt) dropped by the bosses of Delirious maps, and an Ancient version of all 13 (Atlas-tree unlock).
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: Map bosses of Delirious Maps can additionally drop a new set of 3 Potent emotions
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value:
      core_in_order: [Diluted Liquid Ire, Diluted Liquid Guilt, Diluted Liquid Greed, Liquid Paranoia, Liquid Envy, Liquid Disgust, Liquid
          Despair, Concentrated Liquid Fear, Concentrated Liquid Suffering, Concentrated Liquid Isolation]
      potent: [Potent Liquid Melancholy, Potent Liquid Ferocity, Potent Liquid Contempt]
      ancient: [Ancient Diluted Liquid Ire, Ancient Diluted Liquid Guilt, Ancient Diluted Liquid Greed, Ancient Liquid Paranoia, Ancient
          Liquid Envy, Ancient Liquid Disgust, Ancient Liquid Despair, Ancient Concentrated Liquid Fear, Ancient Concentrated Liquid Suffering,
        Ancient Concentrated Liquid Isolation, Ancient Potent Liquid Melancholy, Ancient Potent Liquid Ferocity, Ancient Potent Liquid Contempt]

  - id: distilled_emotion.instil_amulets
    statement: The 10 core and 3 Potent emotions are used at The Withered Willow to instil an amulet with a Notable Passive Skill; the Ancient
      ones cannot (their directions name only Time-Lost jewels).
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Can be used at The Withered Willow to Instil Amulets with a Notable Passive Skill. Right click this item then left click a Rare
      Jewel to apply it.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: distilled_emotion.three_emotions_per_notable
    statement: 'Each instillable notable has a recipe of three emotions (e.g. Insulated Treads: Ire, Ire, Ire); 875 notables can be instilled,
      17 of them only by emotions (e.g. Zarokh''s Gift, a Sinister Jewel Socket; Augmented Flesh, 2 additional skill slots). Instilling
      a notable already allocated on the tree does not grant it twice.'
    source_kind: datamined
    url: https://poe2db.tw/us/Liquid_Emotions
    quote: Instilling a Notable Passive Skill which you have already allocated normally will not grant its effects a second time.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: distilled_emotion.strugglescream_three_more
    statement: The unique amulet Strugglescream can have 3 additional instilled modifiers.
    source_kind: datamined
    url: https://poe2db.tw/us/Liquid_Emotions
    quote: Can have 3 additional Instilled Modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: distilled_emotion.instil_replaces_and_corrupted
    statement: 'UNVERIFIED: instilling an amulet that already has an instilled notable replaces it, and a corrupted amulet cannot be instilled
      (the usual rule that corrupted items cannot be modified). No source read states either.'
    source_kind: datamined
    url: https://poe2db.tw/us/Liquid_Emotions
    quote: Liquid Emotions allow you to instil an amulet with a Notable Passive Skill from the Passive Tree.
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Neither re-instilling nor corrupted amulets are covered by any source read.
    page_statement: A new instil is taken to replace the old one, and a corrupted amulet is taken not to accept one.
    page_source: common player knowledge, not checked in game

  - id: distilled_emotion.jewel_craft
    statement: 'Since 0.5 every emotion also crafts jewels: it removes a random modifier of a Rare jewel and adds a guaranteed crafted modifier
      that depends on the jewel type (Ruby, Sapphire, Emerald, and Diamond for some). The core and Potent emotions work on Rare basic jewels,
      the Ancient ones on Rare Time-Lost jewels.'
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: Liquid Emotions can now be used to craft additional mods on Jewels.
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value: {takes: Rare jewel, removes: 1, adds: crafted}

  - id: distilled_emotion.jewel_craft_mods
