  - id: distilled_emotion.jewel_craft_counts_as_crafted
    statement: 'The jewel modifier of an emotion is a crafted modifier, so the 0.5 rule of one crafted modifier per item applies: a jewel
      that already has a crafted modifier is taken not to accept an emotion (or to lose it) until checked.'
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: All crafted modifiers are now guaranteed, but items can only have 1 crafted modifier at a time.
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: That the emotion's mod falls under the crafted limit is an inference from the word 'Crafted' in its text.
    page_statement: An emotion's jewel modifier is a crafted one, so a jewel holds only one of them.
    page_source: the patch notes and the item text, read together by us

  - id: distilled_emotion.waystone_effect
    statement: 'The first lines of a core or Potent emotion are what it adds to a waystone (`value`: emotion -> lines), up to three emotions
      per waystone; the Ancient ones add nothing to a waystone.'
    source_kind: datamined
    url: https://poe2db.tw/us/Diluted_Liquid_Ire
    quote: Players in Area are 7% Delirious
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Diluted Liquid Ire: [Players in Area are 7% Delirious, 20% increased Magic Monsters]
      Diluted Liquid Guilt: [Players in Area are 9% Delirious, 8% increased Pack Size]
      Diluted Liquid Greed: [Players in Area are 10% Delirious, 8% increased Rarity of Items found]
      Liquid Paranoia: [Players in Area are 12% Delirious, 15% increased Rare Monsters]
      Liquid Envy: [Players in Area are 15% Delirious, 30% increased Waystones found in Area]
      Liquid Disgust: [Players in Area are 18% Delirious, 30% increased Tablets found in Area]
      Liquid Despair: [Players in Area are 20% Delirious, 30% increased Stack size of Simulacrum Splinters found in your Maps]
      Concentrated Liquid Fear: [Players in Area are 22% Delirious, Rare Monsters have a 25% Surpassing chance to have an additional Modifier]
      Concentrated Liquid Suffering: [Players in Area are 25% Delirious, Unique Monsters in your Maps have 1 additional Rare Modifiers]
      Concentrated Liquid Isolation: [Players in Area are 50% Delirious]
      Potent Liquid Melancholy: [Players in Area are 50% Delirious]
      Potent Liquid Ferocity: [Players in Area are 50% Delirious]
      Potent Liquid Contempt: [Players in Area are 50% Delirious]
    approximate: true
    approximate_reason: The lines are game text; the limit of three per waystone rests on search snippets.
    page_statement: Up to three emotions can be added to a waystone, each adding delirium and its own map bonus.
    page_source: the game's item text, with the limit from search-result excerpts

  - id: distilled_emotion.liquid_verisium_is_not_an_emotion
    statement: Liquid Verisium is filed with the emotions by poe2db but is an Expedition item that starts a Runic Remnant encounter; it
      crafts nothing.
    source_kind: datamined
    url: https://poe2db.tw/us/Liquid_Emotions
    quote: Immediately start a Runic Remnant Encounter with a random Runic Inscription
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
