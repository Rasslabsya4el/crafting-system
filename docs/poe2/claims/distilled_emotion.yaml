      Liquid Contempt adds ''+1 Suffix Modifier allowed'' as a prefix or ''+1 Prefix Modifier allowed'' as a suffix, Potent Liquid Ferocity
      ''(40-60)% increased Effect of Suffixes / Prefixes'', Ancient Potent Liquid Melancholy ''Upgrades Radius to Very Large''.'
    source_kind: datamined
    url: https://poe2db.tw/us/Liquid_Emotions
    quote: Removes a random modifer and Augments a Rare Basic Jewel with a new guaranteed Crafted modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
