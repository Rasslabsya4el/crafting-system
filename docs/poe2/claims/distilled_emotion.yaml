          increased Evasion Rating}
      Diluted Liquid Guilt: {Ruby Prefix: (5—15)% increased Fire Damage, Sapphire Prefix: (5—15)% increased Cold Damage, Emerald Prefix: (5—15)%
          increased Lightning Damage}
