    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Greater Jeweller's Orb: 1

  - id: jewellers_orb.perfect_cost
    statement: One use of Perfect Jeweller's Orb consumes one Perfect Jeweller's Orb; the value maps its price name (the item's name in the game data) to the number of items.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
