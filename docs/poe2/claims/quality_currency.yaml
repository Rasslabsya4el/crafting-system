# Mechanic family: quality_currency (the quality currencies: scrap, whetstone, etcher, bauble, prism).
# PoE2 research of 2026-11-24, docs/poe2/research/currency-and-omens.md (PoE2 0.5.5.10 game data, 0.5.0 patch notes, Craft of Exile beta 0.5.5.5).
rules:
  - id: quality_currency.armourers_scrap
    statement: An Armourer's Scrap raises the quality of an armour below its maximum quality.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Improves the [Quality / quality] of an armour
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: quality_currency.blacksmiths_whetstone
    statement: A Blacksmith's Whetstone raises the quality of a martial weapon (not a caster weapon).
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Improves the [Quality / quality] of a [MartialWeapon / martial weapon]
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

