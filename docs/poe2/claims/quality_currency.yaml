  - id: quality_currency.cap_20
    statement: Quality currency cannot raise an item above 20% quality.
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3826682
    quote: Quality currency still cannot apply more than 20% Quality to an item.
    patch_verified: "0.3.0"
    date_checked: 2026-11-24
    value: 20

  - id: quality_currency.amount_by_item_level
    statement: 'Quality added per use (scraps, whetstones, etchers, baubles and catalysts alike) is floor(clamp(30*e^(-ilvl/30) - 0.3, 1, 20)), and a result of 1 becomes 2 with 20% chance: 20 at item level 1, 10 at 30, 6 at 45, 3 at 60, 2 at 75, 1 from 79. Guides give a PoE1-like 5/2/1 by rarity instead; unresolved.'
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: static qualityAmountByItemLevel(e){let t=30*Math.exp(-e/30)-.3,a=Math.floor(Math.max(1,Math.min(t,20)));return"poe2"==gameConstants.game&&1==a&&(a=Math.random()<.2?2:1),a}
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Craft of Exile's item-level formula disagrees with guides that give 5/2/1 by rarity; no game source.
    page_statement: How much quality one use of a quality currency adds is not settled; the emulator ties it to item level.
    page_source: Craft of Exile's code, against community guides

