  - id: alloy.crystallisation_omens_not_assumed
    statement: 'UNVERIFIED: the Crystallisation omens name only ''Perfect or Corrupted Essence'', so the planner does not let them restrict
      an Alloy''s removal until a check shows they do.'
    source_kind: datamined
    url: https://poe2db.tw/us/Omen_of_Dextral_Crystallisation
    quote: your next Perfect or Corrupted Essence will remove only Suffix modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: The omen text names only essences; whether alloys count as essences for it is untested.
    page_statement: The omens that make a Perfect essence remove only prefixes or only suffixes are not assumed to work on alloys.
    page_source: the omen's item text only
