  - id: reforging_recipes.named_runes_not_combined
    statement: Named and endgame runes (the named, Ancient, Warding and Legacy runes) have no combining recipe.
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: X of a Kind Recipe /93
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Rests on a guide for 0.4 and on their absence from poe2db's recipe list.
    page_statement: Named runes cannot be combined into better ones at the bench.
    page_source: a Maxroll guide and poe2db's recipe list

  - id: reforging_recipes.emotions_three_to_one
    statement: 'Three core emotions make one of the next in the chain from Diluted Liquid Ire to Concentrated Liquid Isolation (`value`:
      [three of, make one]); no recipe makes or uses the Potent or Ancient emotions.'
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: Diluted Liquid Ire x3 | Diluted Liquid Guilt x1
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
    - [Diluted Liquid Ire, Diluted Liquid Guilt]
    - [Diluted Liquid Guilt, Diluted Liquid Greed]
    - [Diluted Liquid Greed, Liquid Paranoia]
    - [Liquid Paranoia, Liquid Envy]
    - [Liquid Envy, Liquid Disgust]
    - [Liquid Disgust, Liquid Despair]
    - [Liquid Despair, Concentrated Liquid Fear]
    - [Concentrated Liquid Fear, Concentrated Liquid Suffering]
    - [Concentrated Liquid Suffering, Concentrated Liquid Isolation]

  - id: reforging_recipes.waystones_three_to_one
    statement: Three waystones of one tier make one of the next tier; poe2db's recipes run over tiers 1 to 15. Whether the last recipe makes
      a tier 16 waystone is not stated.
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: X of a Kind Recipe /93
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {lowest_tier: 1, highest_tier_listed: 15}
    approximate: true
    approximate_reason: The note gives the range as tiers 1 to 15 without saying whether 15 is the last input or the last output.
    page_statement: Three waystones of a tier make one of the next tier at the bench.
    page_source: poe2db's recipe list

  - id: reforging_recipes.legacy_runes
    statement: 'Each of the 63 ''Legacy of <unique>'' runes has an Equip recipe: one Aldur''s Legacy plus that unique.'
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: Equip Recipe /68
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: reforging_recipes.equip_recipes
    statement: 'Other Equip recipes: Pearlescent Amulet = Jade + Amber + Lapis Amulet; Diamond = Ruby + Emerald + Sapphire; Time-Lost Diamond
      = Time-Lost Ruby + Emerald + Sapphire; Grasping Mail (rare, unidentified) = 60 Breach Rings, at the Genesis Tree.'
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: Equip Recipe /68
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value:
      Pearlescent Amulet: [Jade Amulet, Amber Amulet, Lapis Amulet]
      Diamond: [Ruby, Emerald, Sapphire]
      Time-Lost Diamond: [Time-Lost Ruby, Time-Lost Emerald, Time-Lost Sapphire]
      Grasping Mail: {Breach Ring: 60}

  - id: reforging_recipes.recipe_counts
    statement: poe2db lists 93 Forge, 68 Equip, 2 Gem, 2 Unique Item and 93 X-of-a-Kind recipes.
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: Forge Recipe /93
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    value: {Forge: 93, Equip: 68, Gem: 2, Unique Item: 2, X of a Kind: 93}

  - id: reforging_recipes.no_gear_three_to_one
    statement: 'UNVERIFIED: the 0.5 recipe list has no ''three items of one base make one'' recipe for gear; the three-to-one recipes are
      for stackables and waystones only. poe2db may omit a generic rule.'
    source_kind: datamined
    url: https://poe2db.tw/us/Reforging_Bench
    quote: X of a Kind Recipe /93
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Absence from poe2db's list only.
    page_statement: There is no bench recipe that turns three pieces of gear into one.
    page_source: poe2db's recipe list
