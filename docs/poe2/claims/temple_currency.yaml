# Mechanic family: temple_currency (the Vaal-group (Fate of the Vaal / Temple of Atziri) currencies, which act on corrupted items, and the Theses).
# PoE2 research of 2026-11-24, docs/poe2/research/currency-and-omens.md (PoE2 0.5.5.10 game data, 0.5.0 patch notes, Craft of Exile beta 0.5.5.5).
rules:
  - id: temple_currency.architects_orb
    statement: An Architect's Orb on a corrupted equipment item or jewel either adds a second Corruption enchantment or destroys the item.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Modifies a [Corrupted] [Equipment] or [Jewel] item unpredictably or destroys it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.architects_orb_odds
    statement: An Architect's Orb destroys the item with 50% chance; otherwise it adds a Corruption enchantment (it only adds enchantments). Maxroll says the same.
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: architect(e){return 1==EmulatorManager.randomNumber(0,2,!0)?(this._item.destroy(),!0):(this.corrupted_add_modifier(e),this._item.corrupt(),!0)}
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    value:
      destroy: 0.5
      add_enchantment: 0.5
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: An Architect's Orb is assumed to destroy the item half the time and add a second enchantment otherwise.
    page_source: Craft of Exile's code and a guide

  - id: temple_currency.crystallised_corruption
    statement: Crystallised Corruption on a corrupted skill gem gives a second corruption outcome that differs from the first, or destroys the gem.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Modifies a [Corrupted] Skill Gem unpredictably or destroys it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.crystallised_corruption_odds
    statement: Crystallised Corruption destroys the gem with 50% chance, and otherwise gives a corruption outcome that cannot repeat the first.
    source_kind: wiki
    url: https://maxroll.gg/poe2/resources/corruption-outcomes
    quote: It gives a second corruption outcome that can't repeat the first. It also has a 50/50 chance to destroy the gem.
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value:
      destroy: 0.5
    approximate: true
    approximate_reason: Only the Maxroll guide gives the 50% figure.
    page_statement: Crystallised Corruption is assumed to destroy the gem half the time.
    page_source: a community guide only

  - id: temple_currency.core_destabiliser
    statement: A Core Destabiliser modifies a Soul Core unpredictably, with a chance to destroy it (it turns into another Soul Core, per a guide). The odds are unknown.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Modifies a [SoulCore / Soul Core] unpredictably, with a chance to destroy it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.ancient_infuser
    statement: An Ancient Infuser modifies a Tablet unpredictably and corrupts it, with the same 4 outcomes as a Vaal Orb on a tablet (vaal_orb.tablet_outcomes).
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Modifies a [Tablet / Tablet] unpredictably and [Corrupted / Corrupts] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.vaal_cultivation_orb
    statement: A Vaal Cultivation Orb replaces up to 2 modifiers on a corrupted Vaal unique (from a hidden special list), and replaces any other unique with a corrupted unique of the same item class. Its outcomes changed in 0.5.0.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Replaces up to 2 modifiers on a [Corrupted] [UniqueCulture / Vaal Unique] Replaces other [ItemRarity / Uniques] with a Corrupted Unique of the same Item Class
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.yaomacs_orb_of_sacrifice
    statement: Yaomac's Orb of Sacrifice upgrades the Corruption enchantment of a corrupted Rare weapon or quiver and removes a random modifier.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Upgrades a [Corrupted / Corruption] Enchantment on a [ItemRarity / Rare] Weapon or Quiver and removes a random Modifier
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.kopecs_orb_of_sacrifice
