  - id: temple_currency.sacrifice_needs_upgradable_enchant
    statement: An Orb of Sacrifice needs an enchantment that has an upgrade; the removed modifier is 1 random non-fractured explicit modifier.
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: vaal_sacrifice(){let e=[];if(this._item.getModifiers().forEach((t,a)=>{let i=DataManager.getEntryFromDict(coedata.mods,t.key);coedata.mods.corruption_upgrades[i.id]&&e.push({index:a,upgrade:coedata.mods.corruption_upgrades[i.id]})})
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    approximate: true
    approximate_reason: Only Craft of Exile's emulator code models this; no game text or patch note states it.
    page_statement: An Orb of Sacrifice is assumed to remove one modifier at random, never a fractured one.
    page_source: Craft of Exile's code only

  - id: temple_currency.vaal_armourers_infuser
    statement: A Vaal Armourer's Infuser raises the quality of an armour at or above its maximum quality, up to 10% past the maximum, with a chance to corrupt it.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Improves the [Quality / quality] of an [Armour], exceeding maximum quality by up to 10% with a chance of [Corrupted / Corrupting] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.vaal_blacksmiths_infuser
    statement: A Vaal Blacksmith's Infuser does the same for a martial weapon.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Improves the [Quality / quality] of a [MartialWeapon / Martial Weapon], exceeding maximum quality by up to 10% with a chance of [Corrupted / Corrupting] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.vaal_arcanists_infuser
    statement: A Vaal Arcanist's Infuser does the same for a wand, staff or sceptre.
    source_kind: datamined
