    quote: Improves the [Quality / quality] of a wand, staff or sceptre, exceeding maximum quality by up to 10% with a chance of [Corrupted / Corrupting] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.vaal_catalysing_infuser
    statement: A Vaal Catalysing Infuser does the same for a ring or amulet.
    source_kind: datamined
