    quote: Improves the [Quality / quality] of a ring or amulet, exceeding maximum quality by up to 10% with a chance of [Corrupted / Corrupting] it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.infuser_needs_20_quality
    statement: Since 0.5.0 an infuser is used only on an item at or above 20% quality (its maximum quality).
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: All Infusers can only be used on items at or above 20% Quality.
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value: 20

  - id: temple_currency.infuser_corruption_chance
    statement: An infuser's corruption chance is 5% per point of quality above the maximum before the use; the cap is maximum quality +10. A 0.4 guide says instead +1 to 2% up to 30%, or corrupt.
    source_kind: coe
    url: https://beta.craftofexile.com/packages/files/package_poe2.js?v=1795533925
    quote: vaal_infuser(){let e=this._item._quality-(parseInt(this._item._maximumQuality)+parseInt(this._item._maximumQualityModifier));e<0&&(e=0);let t=5*e;return this.raiseQuality(null,10),100*Math.random()<=t&&this._item.corrupt(),!0}
    patch_verified: "0.5.5.5"
    date_checked: 2026-11-24
    value:
      corrupt_percent_per_point_over_max: 5
      max_over_maximum: 10
    approximate: true
    approximate_reason: Craft of Exile's formula disagrees with a 0.4 guide; no game source gives the amount or the chance.
    page_statement: How much quality an infuser adds and how often it corrupts the item is not settled.
    page_source: Craft of Exile's code, against a community guide

  - id: temple_currency.orb_of_extraction
    statement: An Orb of Extraction destroys an equipment item and returns the Augments socketed in it that are not Socket-Bound. It is the Vaal socket-recovery item, not a modifier remover.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Destroys an [Equipment] item, returning any non [SocketBound|Socket-Bound] [Augment|Augments] socketed in it
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.vaal_siphoner
    statement: A Vaal Siphoner adds a kill threshold to a corrupted Rare amulet, ring or belt; at the threshold it siphons a random modifier and improves the values of the others. Whether the siphoned modifier is removed or drops a tier, and how far the others rise (to 110% of their maximum, per guides), is disputed.
    source_kind: datamined
    url: https://repoe-fork.github.io/poe2/base_items.json
    quote: Adds a kill threshold to a [Corrupted] [ItemRarity / Rare] [Jewellery] item, when threshold is met [VaalSiphoner / Siphons] a random modifier and improves the numeric values of other modifiers
    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.stack_5000
    statement: Since 0.5.0 Fate of the Vaal currencies stack to 5,000 (the export gives the inventory stack of 10).
    source_kind: official
    url: https://www.pathofexile.com/forum/view-thread/3932540
    quote: Fate of the Vaal Currency Items now have a maximum stack size of 5,000
    patch_verified: "0.5.0"
    date_checked: 2026-11-24
    value: 5000

  - id: temple_currency.guatelitzis_thesis
    statement: 'Guatelitzi''s Thesis (an Ancient Augment, limited to 1, level 60) gives in a helmet: Armour equal to 35% of Life lost from hits in the past 8 seconds; in body armour: 10% of physical damage prevented recouped as Life; in boots: lose 5% of maximum Life per second while sprinting, 25% increased movement speed while sprinting.'
    source_kind: datamined
    url: https://poe2db.tw/us/Fate_of_the_Vaal
    quote: Gain Armour equal to 35% of Life Lost from Hits in the past 8 seconds
    patch_verified: "0.5.0"
    date_checked: 2026-11-24

  - id: temple_currency.citaqualotls_thesis
    statement: 'Citaqualotl''s Thesis gives in body armour: recoup 50% of damage taken by Offerings as Life; in gloves: one persistent minion revives when an Offering expires; in boots: sacrifice 10% of maximum Life to gain that much Guard on Dodge Roll.'
    source_kind: datamined
    url: https://poe2db.tw/us/Fate_of_the_Vaal
    quote: You Recoup 50% of Damage taken by your Offerings as Life
    patch_verified: "0.5.0"
    date_checked: 2026-11-24

  - id: temple_currency.jiquanis_thesis
    statement: 'Jiquani''s Thesis gives in a helmet: +1 maximum Mana per 3 Item Armour on the helmet (a guide says per 2 Item Energy Shield); in gloves: Energy Shield recharge starts after spending 2000 Mana, at most once every 2 seconds; in boots: movement speed changes also apply to Energy Shield recharge rate.'
