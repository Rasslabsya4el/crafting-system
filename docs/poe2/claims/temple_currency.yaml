    patch_verified: "0.5.5.10"
    date_checked: 2026-11-24

  - id: temple_currency.kamasas_orb_of_sacrifice
    statement: Kamasa's Orb of Sacrifice upgrades the Corruption enchantment of a corrupted Rare amulet, ring or belt and removes a random modifier.
